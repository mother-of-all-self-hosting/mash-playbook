---

activation_prefix: wg_easy_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ wg_easy_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ wg_easy_restart_necessary | bool }}"
        groups: [mash, wg-easy]
        when: "{{ wg_easy_enabled }}"
