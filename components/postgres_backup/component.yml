---

description: Periodic PostgreSQL backups to the local filesystem
docs:
  name: Postgres Backup
  url: https://github.com/prodrigestivill/docker-postgres-backup-local
  section: foss
activation_prefix: postgres_backup_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ postgres_backup_identifier }}.service"
        priority: 5000
        restart_necessary: "{{ postgres_backup_restart_necessary | bool }}"
        groups: [mash, backup, postgres-backup]
        when: "{{ postgres_backup_enabled }}"
