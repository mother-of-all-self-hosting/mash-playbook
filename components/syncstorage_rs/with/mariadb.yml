---

syncstorage_rs_database_mysql_hostname: "{{ mariadb_connection_hostname if mariadb_enabled else '' }}"
syncstorage_rs_database_mysql_port: "{{ mariadb_connection_port if mariadb_enabled else '3306' }}"
syncstorage_rs_database_mysql_username: "{{ syncstorage_rs_identifier }}"
syncstorage_rs_database_mysql_password: "{{ (mash_playbook_generic_secret_key + ':db.syncstorage') | hash('sha512') | to_uuid }}"
syncstorage_rs_database_mysql_socket_path_host: "{{ mariadb_run_path }}"
