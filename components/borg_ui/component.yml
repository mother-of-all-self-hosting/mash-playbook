---

activation_prefix: borg_ui_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ borg_ui_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ borg_ui_restart_necessary | bool }}"
        groups: [mash, borg-ui]
        when: "{{ borg_ui_enabled }}"
