---

activation_prefix: bazarr_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ bazarr_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ bazarr_restart_necessary | bool }}"
        groups: [mash, bazarr]
        when: "{{ bazarr_enabled }}"
