---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
bazarr_enabled: false

bazarr_identifier: "{{ mash_playbook_service_identifier_prefix }}bazarr"

bazarr_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}bazarr"

bazarr_uid: "{{ mash_playbook_uid }}"
bazarr_gid: "{{ mash_playbook_gid }}"

bazarr_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([radarr_container_network] if radarr_enabled | default(false) and bazarr_container_network != radarr_container_network else [])
    +
    ([sonarr_container_network] if sonarr_enabled | default(false) and bazarr_container_network != sonarr_container_network else [])
  }}

bazarr_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
bazarr_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
