---

description: A BitTorrent client
docs:
  name: qBittorrent
  url: https://www.qbittorrent.org/
  section: foss
activation_prefix: qbittorrent_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ qbittorrent_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ qbittorrent_restart_necessary | bool }}"
        groups: [mash, qbittorrent]
        when: "{{ qbittorrent_enabled }}"
