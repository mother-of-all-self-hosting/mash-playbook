---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
grafana_enabled: false

grafana_identifier: "{{ mash_playbook_service_identifier_prefix }}grafana"

grafana_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}grafana"

grafana_uid: "{{ mash_playbook_uid }}"
grafana_gid: "{{ mash_playbook_gid }}"

grafana_systemd_wanted_services_list_auto: |
  {{
    ([exim_relay_identifier ~ '.service'] if exim_relay_enabled | default(false) and grafana_mailer_enabled | default(false) and grafana_config_smtp_host == exim_relay_identifier else [])
    +
    ([loki_identifier ~ '.service'] if loki_enabled | default(false) else [])
    +
    ([ntfy_identifier ~ '.service'] if ntfy_enabled | default(false) else [])
    +
    ([prometheus_identifier ~ '.service'] if prometheus_enabled | default(false) else [])
    +
    ([prometheus_node_exporter_identifier ~ '.service'] if prometheus_node_exporter_enabled | default(false) else [])
  }}

grafana_container_additional_networks_auto: |
  {{
    ([exim_relay_container_network] if exim_relay_enabled | default(false) and grafana_mailer_enabled | default(false) and grafana_config_smtp_host == exim_relay_identifier and grafana_container_network != exim_relay_container_network else [])
    +
    ([loki_container_network] if loki_enabled | default(false) and grafana_container_network != loki_container_network else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if (grafana_container_labels_traefik_enabled and mash_playbook_reverse_proxyable_services_additional_network) else [])
    +
    ([ntfy_container_network] if ntfy_enabled | default(false) and grafana_container_network != ntfy_container_network else [])
    +
    ([prometheus_container_network] if prometheus_enabled | default(false) and grafana_container_network != prometheus_container_network else [])
    +
    ([prometheus_node_exporter_container_network] if prometheus_node_exporter_enabled | default(false) and grafana_container_network != prometheus_node_exporter_container_network else [])
  }}

grafana_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
grafana_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
