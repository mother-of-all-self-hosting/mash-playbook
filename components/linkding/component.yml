---

activation_prefix: linkding_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ linkding_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ linkding_restart_necessary | bool }}"
        groups: [mash, linkding]
        when: "{{ linkding_enabled }}"
  hubsite:
    services:
      - name: "{{ hubsite_service_linkding_name }}"
        url: "{{ hubsite_service_linkding_url }}"
        logo_location: "{{ hubsite_service_linkding_logo_location }}"
        description: "{{ hubsite_service_linkding_description }}"
        priority: "{{ hubsite_service_linkding_priority }}"
        when: "{{ hubsite_service_linkding_enabled }}"
  postgres:
    managed_databases:
      - name: "{{ linkding_database_name }}"
        username: "{{ linkding_database_username }}"
        password: "{{ linkding_database_password }}"
        when: "{{ linkding_enabled and (linkding_database_hostname == postgres_connection_hostname or linkding_database_socket_enabled) and linkding_database_type == 'postgres' }}"
