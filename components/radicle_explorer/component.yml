---

description: Radicle user interface for the web browser
activation_prefix: radicle_explorer_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ radicle_explorer_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ radicle_explorer_restart_necessary | bool }}"
        groups: [mash, radicle, radicle-explorer]
        when: "{{ radicle_explorer_enabled }}"
