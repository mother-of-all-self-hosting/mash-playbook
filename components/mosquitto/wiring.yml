---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
mosquitto_enabled: false

mosquitto_identifier: "{{ mash_playbook_service_identifier_prefix }}mosquitto"

mosquitto_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}mosquitto"

mosquitto_uid: "{{ mash_playbook_uid }}"
mosquitto_gid: "{{ mash_playbook_gid }}"

mosquitto_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

# Only enable Traefik labels if a hostname is set (indicating that this will be exposed publicly)
mosquitto_container_labels_traefik_tcp_enabled: "{{ mash_playbook_traefik_labels_enabled and mosquitto_hostname | length > 0 }}"
mosquitto_container_labels_traefik_tcp_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
