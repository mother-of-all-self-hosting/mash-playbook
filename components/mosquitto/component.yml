---

activation_prefix: mosquitto_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ mosquitto_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ mosquitto_restart_necessary | bool }}"
        groups: [mash, mosquitto]
        when: "{{ mosquitto_enabled }}"
  traefik:
    entrypoints:
      - name: "{{ mosquitto_container_labels_traefik_tcp_entrypoints }}"
        port: "{{ mosquitto_container_tcp_tls_port }}"
        host_bind_port: "{{ mosquitto_container_tcp_tls_host_bind_port }}"
        config:
          transport:
            respondingTimeouts:
              readTimeout: "{{ traefik_config_entrypoint_web_transport_respondingTimeouts_readTimeout }}"
              writeTimeout: "{{ traefik_config_entrypoint_web_transport_respondingTimeouts_writeTimeout }}"
              idleTimeout: "{{ traefik_config_entrypoint_web_transport_respondingTimeouts_idleTimeout }}"
        when: "{{ mosquitto_enabled and mosquitto_container_labels_traefik_tcp_enabled }}"
