---

description: Speed test for measuring the connection to your server
docs:
  name: LibreSpeed
  url: https://librespeed.org
  section: foss
activation_prefix: librespeed_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ librespeed_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ librespeed_restart_necessary | bool }}"
        groups: [mash, librespeed]
        when: "{{ librespeed_enabled }}"
