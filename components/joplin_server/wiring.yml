---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
joplin_server_enabled: false

joplin_server_identifier: "{{ mash_playbook_service_identifier_prefix }}joplin-server"

joplin_server_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}joplin-server"

joplin_server_uid: "{{ mash_playbook_uid }}"
joplin_server_gid: "{{ mash_playbook_gid }}"

joplin_server_systemd_required_services_list_auto: |
 {{
    ([postgres_identifier ~ '.service'] if postgres_enabled and (joplin_server_database_hostname == postgres_connection_hostname or joplin_server_database_socket_enabled) else [])
  }}

joplin_server_systemd_wanted_services_list_auto: |
  {{
    ([exim_relay_identifier ~ '.service'] if exim_relay_enabled | default(false) and joplin_server_environment_variable_mailer_enabled | default(false) and joplin_server_environment_variable_mailer_host == exim_relay_identifier else [])
  }}

joplin_server_container_additional_networks_auto: |
  {{
    ([exim_relay_container_network] if exim_relay_enabled | default(false) and joplin_server_environment_variable_mailer_enabled | default(false) and joplin_server_environment_variable_mailer_host == exim_relay_identifier and joplin_server_container_network != exim_relay_container_network else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgres_container_network] if postgres_enabled and (joplin_server_database_hostname == postgres_connection_hostname and joplin_server_container_network != postgres_container_network and not joplin_server_database_socket_enabled) else [])
  }}

joplin_server_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
joplin_server_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
