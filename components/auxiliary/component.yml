---

description: Auxiliary file/directory management on your server via Ansible
docs:
  name: AUX
  url: https://github.com/mother-of-all-self-hosting/ansible-role-aux
  section: system
activation_prefix: aux_

setup:
  priority: 9000
  entry:
    # Run last to to ensure that all other roles have created their paths, etc.,
    # and this role can build on top of all that.
    - role: galaxy/auxiliary
