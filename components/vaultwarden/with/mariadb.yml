---

vaultwarden_database_mysql_hostname: "{{ mariadb_connection_hostname if mariadb_enabled and not vaultwarden_database_mysql_socket_enabled else '' }}"
vaultwarden_database_mysql_port: "{{ mariadb_connection_port if mariadb_enabled else '3306' }}"
vaultwarden_database_mysql_password: "{{ (mash_playbook_generic_secret_key + ':db.vaultwarden') | hash('sha512') | to_uuid }}"
vaultwarden_database_mysql_socket_path_host: "{{ mariadb_run_path }}"
