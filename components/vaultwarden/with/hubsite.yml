---

# Vaultwarden
# The vaultwarden service link is deactivated by default for security reasons, see: https://github.com/dani-garcia/vaultwarden/wiki/Hardening-Guide#hiding-under-a-subdir
mash_playbook_hubsite_service_vaultwarden_enabled: false
mash_playbook_hubsite_service_vaultwarden_name: Vaultwarden
mash_playbook_hubsite_service_vaultwarden_url: "https://{{ vaultwarden_hostname }}{{ vaultwarden_path_prefix }}"
mash_playbook_hubsite_service_vaultwarden_logo_location: "{{ role_path }}/assets/vaultwarden.png"
mash_playbook_hubsite_service_vaultwarden_description: "Securely access your passwords"
mash_playbook_hubsite_service_vaultwarden_priority: 1000
