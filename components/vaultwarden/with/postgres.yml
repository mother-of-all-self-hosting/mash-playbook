---

vaultwarden_database_postgres_hostname: "{{ postgres_connection_hostname if postgres_enabled and not vaultwarden_database_postgres_socket_enabled else '' }}"
vaultwarden_database_postgres_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
vaultwarden_database_postgres_password: "{{ (mash_playbook_generic_secret_key + ':db.vaultwarden') | hash('sha512') | to_uuid }}"
vaultwarden_database_postgres_sslmode: "{{ 'disable' if postgres_enabled and (vaultwarden_database_postgres_hostname == postgres_connection_hostname or vaultwarden_database_postgres_socket_enabled) else 'prefer' }}"
vaultwarden_database_postgres_socket_path_host: "{{ postgres_run_path }}"
