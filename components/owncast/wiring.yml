---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
owncast_enabled: false

owncast_identifier: "{{ mash_playbook_service_identifier_prefix }}owncast"

owncast_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}owncast"

owncast_uid: "{{ mash_playbook_uid }}"
owncast_gid: "{{ mash_playbook_gid }}"

owncast_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

owncast_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
owncast_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"

owncast_container_labels_traefik_metrics_enabled: "{{ mash_playbook_metrics_exposure_enabled }}"
owncast_container_labels_traefik_metrics_hostname: "{{ mash_playbook_metrics_exposure_hostname }}"
owncast_container_labels_traefik_metrics_path_prefix: "{{ mash_playbook_metrics_exposure_path_prefix }}/{{ owncast_identifier }}"
# The variables for HTTP Basic authentication are intentionally not defined, as it is managed by the service itself
