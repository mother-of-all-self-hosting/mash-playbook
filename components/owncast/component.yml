---

activation_prefix: owncast_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ owncast_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ owncast_restart_necessary | bool }}"
        groups: [mash, owncast]
        when: "{{ owncast_enabled }}"
  hubsite:
    services:
      - name: "{{ mash_playbook_hubsite_service_owncast_name }}"
        url: "{{ mash_playbook_hubsite_service_owncast_url }}"
        logo_location: "{{ mash_playbook_hubsite_service_owncast_logo_location }}"
        description: "{{ mash_playbook_hubsite_service_owncast_description }}"
        priority: "{{ mash_playbook_hubsite_service_owncast_priority }}"
        when: "{{ mash_playbook_hubsite_service_owncast_enabled }}"
