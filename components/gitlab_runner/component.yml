---

activation_prefix: gitlab_runner_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ gitlab_runner_identifier }}.service"
        priority: 2100
        restart_necessary: "{{ gitlab_runner_restart_necessary | bool }}"
        groups: [mash, gitlab-runner]
        when: "{{ gitlab_runner_enabled }}"
