---

activation_prefix: send_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ send_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ send_restart_necessary | bool }}"
        groups: [mash, send]
        when: "{{ send_enabled }}"
  hubsite:
    services:
      - name: "{{ hubsite_service_send_name }}"
        url: "{{ hubsite_service_send_url }}"
        logo_location: "{{ hubsite_service_send_logo_location }}"
        description: "{{ hubsite_service_send_description }}"
        priority: "{{ hubsite_service_send_priority }}"
        when: "{{ hubsite_service_send_enabled }}"
