---

activation_prefix: forgejo_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ forgejo_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ forgejo_restart_necessary | bool }}"
        groups: [mash, forgejo]
        when: "{{ forgejo_enabled }}"
  hubsite:
    services:
      - name: "{{ mash_playbook_hubsite_service_forgejo_name }}"
        url: "{{ mash_playbook_hubsite_service_forgejo_url }}"
        logo_location: "{{ mash_playbook_hubsite_service_forgejo_logo_location }}"
        description: "{{ mash_playbook_hubsite_service_forgejo_description }}"
        priority: "{{ mash_playbook_hubsite_service_forgejo_priority }}"
        when: "{{ mash_playbook_hubsite_service_forgejo_enabled }}"
  mariadb:
    managed_databases:
      - name: "{{ forgejo_database_name }}"
        username: "{{ forgejo_database_mysql_username }}"
        password: "{{ forgejo_database_mysql_password }}"
        when: "{{ forgejo_enabled and (forgejo_database_mysql_hostname == mariadb_connection_hostname or forgejo_database_mysql_socket_enabled) and forgejo_database_type == 'mysql' }}"
  postgres:
    managed_databases:
      - name: "{{ forgejo_database_name }}"
        username: "{{ forgejo_database_postgres_username }}"
        password: "{{ forgejo_database_postgres_password }}"
        when: "{{ forgejo_enabled and (forgejo_database_postgres_hostname == postgres_connection_hostname or forgejo_database_postgres_socket_enabled) and forgejo_database_type == 'postgres' }}"
  traefik:
    entrypoints:
      - name: "{{ forgejo_container_labels_traefik_tcp_entrypoints }}"
        port: "{{ forgejo_config_server_ssh_listen_port }}"
        host_bind_port: "{{ forgejo_container_ssh_host_bind_port }}"
        config:
          transport:
            respondingTimeouts:
              readTimeout: "{{ traefik_config_entrypoint_web_transport_respondingTimeouts_readTimeout }}"
              writeTimeout: "{{ traefik_config_entrypoint_web_transport_respondingTimeouts_writeTimeout }}"
              idleTimeout: "{{ traefik_config_entrypoint_web_transport_respondingTimeouts_idleTimeout }}"
        when: "{{ forgejo_enabled and forgejo_container_labels_traefik_tcp_enabled and forgejo_container_ssh_host_bind_port }}"
