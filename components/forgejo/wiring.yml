---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
forgejo_enabled: false

forgejo_identifier: "{{ mash_playbook_service_identifier_prefix }}forgejo"

forgejo_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}forgejo"

forgejo_uid: "{{ mash_playbook_uid }}"
forgejo_gid: "{{ mash_playbook_gid }}"

forgejo_systemd_required_services_list_auto: |
  {{
    ([mariadb_identifier ~ '.service'] if mariadb_enabled | default(false) and (forgejo_database_mysql_hostname == mariadb_connection_hostname or forgejo_database_mysql_socket_enabled) and forgejo_database_type == 'mysql' else [])
    +
    ([memcached_identifier ~ '.service'] if memcached_enabled | default(false) and (forgejo_config_cache_adapter == 'memcache' or forgejo_cache_memcache_socket_enabled) else [])
    +
    ([postgres_identifier ~ '.service'] if postgres_enabled | default(false) and (forgejo_database_postgres_hostname == postgres_connection_hostname or forgejo_database_postgres_socket_enabled) and forgejo_database_type == 'postgres' else [])
  }}

forgejo_systemd_wanted_services_list_auto: |
  {{
    ([exim_relay_identifier ~ '.service'] if exim_relay_enabled | default(false) and forgejo_config_mailer_enabled | default(false) and forgejo_config_mailer_smtp_addr == exim_relay_identifier else [])
    +
    ([meilisearch_identifier ~ '.service'] if meilisearch_enabled | default(false) and forgejo_environment_variables_indexer_issue_indexer_type == 'meilisearch' else [])
  }}

forgejo_container_additional_networks_auto: |
  {{
    ([exim_relay_container_network] if exim_relay_enabled | default(false) and forgejo_config_mailer_enabled | default(false) and forgejo_config_mailer_smtp_addr == exim_relay_identifier and forgejo_container_network != exim_relay_container_network else [])
    +
    ([mariadb_container_network] if mariadb_enabled | default(false) and (forgejo_database_mysql_hostname == mariadb_connection_hostname and forgejo_container_network != mariadb_container_network and not forgejo_database_mysql_socket_enabled) and forgejo_database_type == 'mysql' else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([meilisearch_container_network] if meilisearch_enabled | default(false) and forgejo_container_network != meilisearch_container_network and forgejo_environment_variables_indexer_issue_indexer_type == 'meilisearch' else [])
    +
    ([memcached_container_network] if memcached_enabled | default(false) and (forgejo_container_network != memcached_container_network and not forgejo_cache_memcache_socket_enabled) and forgejo_config_cache_adapter == 'memcache' else [])
    +
    ([postgres_container_network] if postgres_enabled | default(false) and (forgejo_database_postgres_hostname == postgres_connection_hostname and forgejo_container_network != postgres_container_network and not forgejo_database_postgres_socket_enabled) and forgejo_database_type == 'postgres' else [])
  }}

forgejo_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
forgejo_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
forgejo_container_labels_traefik_compression_middleware_enabled: "{{ mash_playbook_reverse_proxy_traefik_middleware_compession_enabled }}"
forgejo_container_labels_traefik_compression_middleware_name: "{{ mash_playbook_reverse_proxy_traefik_middleware_compession_name if mash_playbook_reverse_proxy_traefik_middleware_compession_enabled else '' }}"

forgejo_container_labels_traefik_metrics_enabled: "{{ forgejo_config_metrics_enabled and mash_playbook_metrics_exposure_enabled }}"
forgejo_container_labels_traefik_metrics_hostname: "{{ mash_playbook_metrics_exposure_hostname }}"
forgejo_container_labels_traefik_metrics_path_prefix: "{{ mash_playbook_metrics_exposure_path_prefix }}/{{ forgejo_identifier }}"
forgejo_container_labels_traefik_metrics_middleware_basic_auth_enabled: "{{ mash_playbook_metrics_exposure_http_basic_auth_enabled }}"
forgejo_container_labels_traefik_metrics_middleware_basic_auth_users: "{{ mash_playbook_metrics_exposure_http_basic_auth_users }}"

forgejo_config_metrics_enabled: "{{ prometheus_enabled | default(false) or mash_playbook_metrics_exposure_enabled }}"
