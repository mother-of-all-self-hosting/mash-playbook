---

forgejo_database_postgres_hostname: "{{ postgres_connection_hostname if postgres_enabled and not forgejo_database_postgres_socket_enabled else '' }}"
forgejo_database_postgres_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
forgejo_database_postgres_password: "{{ (mash_playbook_generic_secret_key + ':db.forgejo') | hash('sha512') | to_uuid }}"
forgejo_database_postgres_sslmode: "{{ 'disable' if postgres_enabled and (forgejo_database_postgres_hostname == postgres_connection_hostname or forgejo_database_postgres_socket_enabled) else 'require' }}"
forgejo_database_postgres_socket_path_host: "{{ postgres_run_path }}"
