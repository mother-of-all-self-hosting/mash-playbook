---

forgejo_database_mysql_hostname: "{{ mariadb_connection_hostname if mariadb_enabled and not forgejo_database_mysql_socket_enabled else '' }}"
forgejo_database_mysql_port: "{{ mariadb_connection_port if mariadb_enabled else '3306' }}"
forgejo_database_mysql_password: "{{ (mash_playbook_generic_secret_key + ':db.forgejo') | hash('sha512') | to_uuid }}"
forgejo_database_mysql_sslmode: "{{ 'false' if mariadb_enabled and (forgejo_database_mysql_hostname == mariadb_connection_hostname or forgejo_database_mysql_socket_enabled) else 'prefer' }}"
forgejo_database_mysql_socket_path_host: "{{ mariadb_run_path }}"
