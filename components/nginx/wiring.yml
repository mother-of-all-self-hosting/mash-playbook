---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
nginx_enabled: false

nginx_identifier: "{{ mash_playbook_service_identifier_prefix }}nginx"

nginx_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}nginx"

nginx_uid: "{{ mash_playbook_uid }}"
nginx_gid: "{{ mash_playbook_gid }}"

nginx_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

nginx_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
nginx_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
nginx_container_labels_traefik_compression_middleware_enabled: "{{ mash_playbook_reverse_proxy_traefik_middleware_compession_enabled }}"
nginx_container_labels_traefik_compression_middleware_name: "{{ mash_playbook_reverse_proxy_traefik_middleware_compession_name if mash_playbook_reverse_proxy_traefik_middleware_compession_enabled else '' }}"
