---

gotify_database_mysql_hostname: "{{ mariadb_connection_hostname if mariadb_enabled and not gotify_database_mysql_socket_enabled else '' }}"
gotify_database_mysql_port: "{{ mariadb_connection_port if mariadb_enabled else '3306' }}"
gotify_database_mysql_password: "{{ (mash_playbook_generic_secret_key + ':m.gotify') | hash('sha512') | to_uuid }}"
gotify_database_mysql_socket_path_host: "{{ mariadb_run_path }}"
