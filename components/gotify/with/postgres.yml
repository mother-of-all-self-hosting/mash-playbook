---

gotify_database_postgres_hostname: "{{ postgres_connection_hostname if postgres_enabled and not gotify_database_postgres_socket_enabled else '' }}"
gotify_database_postgres_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
gotify_database_postgres_password: "{{ (mash_playbook_generic_secret_key + ':p.gotify') | hash('sha512') | to_uuid }}"
gotify_database_postgres_sslmode: "{{ 'disable' if postgres_enabled and (gotify_database_postgres_hostname == postgres_connection_hostname or gotify_database_postgres_socket_enabled) else 'prefer' }}"
gotify_database_postgres_socket_path_host: "{{ postgres_run_path }}"
