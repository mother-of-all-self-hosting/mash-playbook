---

activation_prefix: echoip_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ echoip_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ echoip_restart_necessary | bool }}"
        groups: [mash, echoip]
        when: "{{ echoip_enabled }}"
