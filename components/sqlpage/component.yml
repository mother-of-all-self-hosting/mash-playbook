---

activation_prefix: sqlpage_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ sqlpage_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ sqlpage_restart_necessary | bool }}"
        groups: [mash, sqlpage]
        when: "{{ sqlpage_enabled }}"
