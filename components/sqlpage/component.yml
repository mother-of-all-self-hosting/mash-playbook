---

description: SQL-only data application builder
docs:
  name: SQLPage
  url: https://sql-page.com/
  section: foss
activation_prefix: sqlpage_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ sqlpage_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ sqlpage_restart_necessary | bool }}"
        groups: [mash, sqlpage]
        when: "{{ sqlpage_enabled }}"
  mariadb:
    managed_databases:
      - name: "{{ sqlpage_database_name }}"
        username: "{{ sqlpage_database_mysql_username }}"
        password: "{{ sqlpage_database_mysql_password }}"
        when: "{{ sqlpage_enabled and (sqlpage_database_mysql_hostname == mariadb_connection_hostname or sqlpage_database_mysql_socket_enabled) and sqlpage_database_type == 'mysql' }}"
  postgres:
    managed_databases:
      - name: "{{ sqlpage_database_name }}"
        username: "{{ sqlpage_database_postgres_username }}"
        password: "{{ sqlpage_database_postgres_password }}"
        when: "{{ sqlpage_enabled and (sqlpage_database_postgres_hostname == postgres_connection_hostname or sqlpage_database_postgres_socket_enabled) and sqlpage_database_type == 'postgres' }}"
