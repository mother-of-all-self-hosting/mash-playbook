---

sqlpage_database_mysql_hostname: "{{ mariadb_connection_hostname if mariadb_enabled and not sqlpage_database_mysql_socket_enabled else '' }}"
sqlpage_database_mysql_port: "{{ mariadb_connection_port if mariadb_enabled else '3306' }}"
sqlpage_database_mysql_password: "{{ (mash_playbook_generic_secret_key + ':db.sqlpage.ma') | hash('sha512') | to_uuid }}"
sqlpage_database_mysql_socket_path_host: "{{ mariadb_run_path }}"
