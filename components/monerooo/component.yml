---

activation_prefix: monerooo_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ monerooo_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ monerooo_restart_necessary | bool }}"
        groups: [mash, monerooo]
        when: "{{ monerooo_enabled }}"
