---

roundcube_database_mysql_hostname: "{{ mariadb_connection_hostname if mariadb_enabled else '' }}"
roundcube_database_mysql_port: "{{ mariadb_connection_port if mariadb_enabled else '3306' }}"
roundcube_database_mysql_password: "{{ (mash_playbook_generic_secret_key + ':roundcube.m') | hash('sha512') | to_uuid }}"
roundcube_database_mysql_socket_path_host: "{{ mariadb_run_path }}"
