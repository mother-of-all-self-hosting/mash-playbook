---

roundcube_database_postgres_hostname: "{{ postgres_connection_hostname if postgres_enabled else '' }}"
roundcube_database_postgres_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
roundcube_database_postgres_password: "{{ (mash_playbook_generic_secret_key + ':db.roundcube') | hash('sha512') | to_uuid }}"
roundcube_database_postgres_socket_path_host: "{{ postgres_run_path }}"
