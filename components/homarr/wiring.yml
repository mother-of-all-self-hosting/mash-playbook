---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
homarr_enabled: false

homarr_identifier: "{{ mash_playbook_service_identifier_prefix }}homarr"

homarr_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}homarr"

homarr_uid: "{{ mash_playbook_uid }}"
homarr_gid: "{{ mash_playbook_gid }}"

homarr_systemd_required_services_list_auto: |
  {{
    ([container_socket_proxy_identifier + '.service'] if container_socket_proxy_enabled else [])
    +
    ([postgres_identifier ~ '.service'] if postgres_enabled | default(false) and (homarr_database_postgres_hostname == postgres_connection_hostname or homarr_database_postgres_socket_enabled) and homarr_database_type == 'postgres' else [])
  }}

homarr_systemd_wanted_services_list_auto: |
  {{
    ([ntfy_identifier ~ '.service'] if ntfy_enabled | default(false) else [])
  }}

homarr_container_additional_networks_auto: |
  {{
    ([container_socket_proxy_container_network] if container_socket_proxy_enabled else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([ntfy_container_network] if ntfy_enabled | default(false) and homarr_container_network != ntfy_container_network else [])
    +
    ([postgres_container_network] if postgres_enabled | default(false) and (homarr_database_postgres_hostname == postgres_connection_hostname and homarr_container_network != postgres_container_network and not homarr_database_postgres_socket_enabled) and homarr_database_type == 'postgres' else [])
  }}

homarr_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
homarr_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
