---

activation_prefix: tinc_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ tinc_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ tinc_restart_necessary | bool }}"
        groups: [mash, tinc]
        when: "{{ tinc_enabled }}"
