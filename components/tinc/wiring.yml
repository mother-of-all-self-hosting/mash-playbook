---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
tinc_enabled: false

tinc_identifier: "{{ mash_playbook_service_identifier_prefix }}tinc"

tinc_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}tinc"

tinc_uid: "{{ mash_playbook_uid }}"
tinc_gid: "{{ mash_playbook_gid }}"
