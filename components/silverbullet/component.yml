---

activation_prefix: silverbullet_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ silverbullet_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ silverbullet_restart_necessary | bool }}"
        groups: [mash, silverbullet]
        when: "{{ silverbullet_enabled }}"
