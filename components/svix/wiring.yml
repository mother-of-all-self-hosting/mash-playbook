---

svix_server_enabled: false

svix_server_identifier: "{{ mash_playbook_service_identifier_prefix }}svix-server"

svix_server_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}svix-server"

svix_server_uid: "{{ mash_playbook_uid }}"
svix_server_gid: "{{ mash_playbook_gid }}"

svix_server_systemd_required_services_list_auto: |
  {{
    ([postgres_identifier ~ '.service'] if postgres_enabled and (svix_server_database_hostname == postgres_connection_hostname or svix_server_database_socket_enabled) else [])
  }}

svix_server_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgres_container_network] if postgres_enabled and (svix_server_database_hostname == postgres_connection_hostname and svix_server_container_network != postgres_container_network and not svix_server_database_socket_enabled) else [])
  }}

svix_server_environment_variables_svix_jwt_secret: "{{ (mash_playbook_generic_secret_key + ':svix') | hash('sha512') | to_uuid }}"

svix_server_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
svix_server_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
