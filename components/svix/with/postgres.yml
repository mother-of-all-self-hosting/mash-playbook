---

svix_server_database_hostname: "{{ postgres_connection_hostname if postgres_enabled and not svix_server_database_socket_enabled else '' }}"
svix_server_database_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
svix_server_database_password: "{{ (mash_playbook_generic_secret_key + ':db.svix') | hash('sha512') | to_uuid }}"
svix_server_database_socket_path_host: "{{ postgres_run_path }}"
