---

activation_prefix: copyparty_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ copyparty_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ copyparty_restart_necessary | bool }}"
        groups: [mash, copyparty]
        when: "{{ copyparty_enabled }}"
