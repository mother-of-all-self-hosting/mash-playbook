---

activation_prefix: apprise_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ apprise_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ apprise_restart_necessary | bool }}"
        groups: [mash, apprise]
        when: "{{ apprise_enabled }}"
