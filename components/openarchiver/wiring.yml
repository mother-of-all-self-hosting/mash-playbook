---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
openarchiver_enabled: false

openarchiver_identifier: "{{ mash_playbook_service_identifier_prefix }}openarchiver"

openarchiver_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}openarchiver"

# Open Archiver runs only as root user
openarchiver_uid: "0"
openarchiver_gid: "0"

openarchiver_systemd_required_services_list_auto: |
  {{
    ([postgres_identifier ~ '.service'] if postgres_enabled and openarchiver_database_hostname == postgres_connection_hostname else [])
    +
    ([meilisearch_identifier ~ '.service'] if meilisearch_enabled else [])
  }}

openarchiver_systemd_wanted_services_list_auto: |
  {{
    ([tika_identifier ~ '.service'] if tika_enabled | default(false) else [])
  }}

openarchiver_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([meilisearch_container_network] if meilisearch_enabled and openarchiver_container_network != meilisearch_container_network else [])
    +
    ([postgres_container_network] if postgres_enabled and openarchiver_database_hostname == postgres_connection_hostname and openarchiver_container_network != postgres_container_network else [])
    +
    ([tika_container_network] if tika_enabled | default(false) and openarchiver_container_network != tika_container_network else [])
  }}

openarchiver_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
openarchiver_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"

openarchiver_environment_variables_jwt_secret: "{{ (mash_playbook_generic_secret_key + ':openarchiver.j') | hash('sha512') | to_uuid }}"
