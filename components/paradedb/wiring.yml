---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
paradedb_enabled: false

paradedb_identifier: "{{ mash_playbook_service_identifier_prefix }}paradedb"

paradedb_architecture: "{{ mash_playbook_architecture }}"

paradedb_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}paradedb"

paradedb_uid: "{{ mash_playbook_uid }}"
paradedb_gid: "{{ mash_playbook_gid }}"

# This includes everything for maximum safety.
# It may not be optimal though, because some services may not be dependent on ParadeDB at all, etc.
paradedb_systemd_services_to_stop_for_maintenance_list_auto: "{{ devture_systemd_service_manager_services_list_auto | map(attribute='name') | reject('equalto', (paradedb_identifier + '.service')) }}"
