---

activation_prefix: mozhi_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ mozhi_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ mozhi_restart_necessary | bool }}"
        groups: [mash, mozhi]
        when: "{{ mozhi_enabled }}"
