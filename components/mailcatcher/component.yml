---

activation_prefix: mailcatcher_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ mailcatcher_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ mailcatcher_restart_necessary | bool }}"
        groups: [mash, mailcatcher]
        when: "{{ mailcatcher_enabled }}"
