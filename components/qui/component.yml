---

description: A fast, modern web interface for qBittorrent
docs:
  name: qui
  url: https://getqui.com/
  section: foss
activation_prefix: qui_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ qui_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ qui_restart_necessary | bool }}"
        groups: [mash, qui]
        when: "{{ qui_enabled }}"
