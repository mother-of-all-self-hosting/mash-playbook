---

description: The trusted server of ArtiDezi, a self-hosted maintenance agent
docs:
  name: ArtiDezi orchestrator
  url: https://github.com/devture/artidezi
  section: foss
activation_prefix: artidezi_orchestrator_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ artidezi_orchestrator_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ artidezi_orchestrator_restart_necessary | bool }}"
        groups: [mash, artidezi-orchestrator]
        when: "{{ artidezi_orchestrator_enabled }}"
