---

description: Metrics collection and alerting monitoring solution
docs:
  name: Prometheus
  url: https://prometheus.io/
  section: foss
activation_prefix: prometheus_enabled

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ prometheus_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ prometheus_restart_necessary | bool }}"
        groups: [mash, metrics, prometheus]
        when: "{{ prometheus_enabled }}"
