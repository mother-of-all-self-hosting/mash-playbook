---

activation_prefix: nodebb_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ nodebb_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ nodebb_restart_necessary | bool }}"
        groups: [mash, nodebb]
        when: "{{ nodebb_enabled }}"
