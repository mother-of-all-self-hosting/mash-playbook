---

activation_prefix: gokapi_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ gokapi_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ gokapi_restart_necessary | bool }}"
        groups: [mash, gokapi]
        when: "{{ gokapi_enabled }}"
