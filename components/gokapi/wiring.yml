---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
gokapi_enabled: false

gokapi_identifier: "{{ mash_playbook_service_identifier_prefix }}gokapi"

gokapi_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}gokapi"

gokapi_uid: "{{ mash_playbook_uid }}"
gokapi_gid: "{{ mash_playbook_gid }}"

gokapi_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

gokapi_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
gokapi_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
