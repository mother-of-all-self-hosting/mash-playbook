---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
wazuh_enabled: false

wazuh_identifier: "{{ mash_playbook_service_identifier_prefix }}wazuh"

wazuh_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}wazuh"

# wazuh_uid and wazuh_gid are intentionally not set here — they are
# hardcoded upstream due to container requirements and are non-configurable.

wazuh_dashboard_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

wazuh_dashboard_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
wazuh_dashboard_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
