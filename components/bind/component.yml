---

description: A full-featured DNS server
docs:
  name: BIND
  url: https://www.isc.org/bind/
  section: foss
activation_prefix: bind_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ bind_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ bind_restart_necessary | bool }}"
        groups: [mash, bind]
        when: "{{ bind_enabled }}"
