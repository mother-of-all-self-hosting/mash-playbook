---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
bind_enabled: false

bind_identifier: "{{ mash_playbook_service_identifier_prefix }}bind"

bind_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}bind"

# Intentionally not messing around with `bind_uid` and `bind_gid` here.
# Using custom values doesn't work.

bind_config_key_default_rndc_enabled: true
bind_config_key_default_rndc_secret_raw: "{{ (mash_playbook_generic_secret_key + ':bind.rndc') | hash('sha512') | to_uuid }}"

bind_systemd_required_services_list_auto: |
  {{
    ([devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [])
  }}
