---

gitea_database_postgres_hostname: "{{ postgres_connection_hostname if postgres_enabled else '' }}"
gitea_database_postgres_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
gitea_database_postgres_password: "{{ (mash_playbook_generic_secret_key + ':db.gitea') | hash('sha512') | to_uuid }}"
gitea_database_postgres_sslmode: "{{ 'disable' if postgres_enabled and (gitea_database_postgres_hostname == postgres_connection_hostname or gitea_database_postgres_socket_enabled) else 'require' }}"
gitea_database_postgres_socket_path_host: "{{ postgres_run_path }}"
