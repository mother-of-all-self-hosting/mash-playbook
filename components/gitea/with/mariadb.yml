---

gitea_database_mysql_hostname: "{{ mariadb_connection_hostname if mariadb_enabled else '' }}"
gitea_database_mysql_port: "{{ mariadb_connection_port if mariadb_enabled else '3306' }}"
gitea_database_mysql_password: "{{ (mash_playbook_generic_secret_key + ':db.gitea') | hash('sha512') | to_uuid }}"
gitea_database_mysql_sslmode: "{{ 'false' if mariadb_enabled and (gitea_database_mysql_hostname == mariadb_connection_hostname or gitea_database_mysql_socket_enabled) else 'prefer' }}"
gitea_database_mysql_socket_path_host: "{{ mariadb_run_path }}"
