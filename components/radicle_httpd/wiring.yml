---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
radicle_httpd_enabled: false

radicle_httpd_identifier: "{{ mash_playbook_service_identifier_prefix }}radicle-httpd"

radicle_httpd_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}radicle-httpd"

# Run as the same user as radicle_node does
radicle_httpd_uid: "{{ radicle_node_uid }}"
radicle_httpd_gid: "{{ radicle_node_gid }}"

radicle_httpd_systemd_required_services_list_auto: |
  {{
    ([radicle_node_identifier ~ '.service'] if radicle_node_enabled else [])
  }}

radicle_httpd_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([radicle_node_container_network] if radicle_node_enabled and radicle_httpd_container_network != radicle_node_container_network else [])
  }}

radicle_httpd_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
radicle_httpd_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
