---

description: Gateway between the Radicle protocol and the HTTP protocol
docs:
  name: Radicle HTTP Daemon
  url: https://radicle.network/nodes/seed.radicle.dev/rad%3Az4V1sjrXqjvFdnCUbxPFqd5p4DtH5/tree/explorer/crates/radicle-httpd/radicle-httpd.1.adoc
  section: foss
activation_prefix: radicle_httpd_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ radicle_httpd_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ radicle_httpd_restart_necessary | bool }}"
        groups: [mash, radicle, radicle-httpd]
        when: "{{ radicle_httpd_enabled }}"
