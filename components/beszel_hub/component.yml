---

activation_prefix: beszel_hub_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ beszel_hub_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ beszel_hub_restart_necessary | bool }}"
        groups: [mash, beszel-hub]
        when: "{{ beszel_hub_enabled }}"
