---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
beszel_hub_enabled: false

beszel_hub_identifier: "{{ mash_playbook_service_identifier_prefix }}beszel-hub"

beszel_hub_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}beszel-hub"

beszel_hub_uid: "{{ mash_playbook_uid }}"
beszel_hub_gid: "{{ mash_playbook_gid }}"

beszel_hub_systemd_wanted_services_list_auto: |
  {{
    ([tsdproxy_identifier ~ '.service'] if tsdproxy_enabled | default(false) and beszel_hub_container_labels_tsdproxy_enabled else [])
  }}

beszel_hub_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([tsdproxy_container_network] if tsdproxy_enabled | default(false) and beszel_hub_container_labels_tsdproxy_enabled and beszel_hub_container_network != tsdproxy_container_network else [])
  }}

beszel_hub_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
beszel_hub_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
