---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
feishin_enabled: false

feishin_identifier: "{{ mash_playbook_service_identifier_prefix }}feishin"

feishin_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}feishin"

# Run as nginx:nginx
feishin_uid: "101"
feishin_gid: "101"

feishin_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

feishin_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
feishin_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
