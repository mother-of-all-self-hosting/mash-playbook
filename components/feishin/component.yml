---

activation_prefix: feishin_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ feishin_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ feishin_restart_necessary | bool }}"
        groups: [mash, feishin]
        when: "{{ feishin_enabled }}"
