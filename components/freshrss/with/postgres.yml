---

freshrss_database_postgres_hostname: "{{ freshrss_database_postgres_socket_path_container if freshrss_database_postgres_socket_enabled else (postgres_connection_hostname if postgres_enabled else '') }}"
freshrss_database_postgres_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
freshrss_database_postgres_password: "{{ (mash_playbook_generic_secret_key + ':p.freshrss') | hash('sha512') | to_uuid }}"
freshrss_database_postgres_socket_path_host: "{{ postgres_run_path }}"
