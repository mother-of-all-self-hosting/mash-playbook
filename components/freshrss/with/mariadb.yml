---

freshrss_database_mysql_hostname: "{{ freshrss_database_mysql_socket_path_container if freshrss_database_mysql_socket_enabled else (mariadb_connection_hostname if mariadb_enabled else '') }}"
freshrss_database_mysql_port: "{{ mariadb_connection_port if mariadb_enabled else '3306' }}"
freshrss_database_mysql_password: "{{ (mash_playbook_generic_secret_key + ':m.freshrss') | hash('sha512') | to_uuid }}"
freshrss_database_mysql_socket_path_host: "{{ mariadb_run_path }}"
