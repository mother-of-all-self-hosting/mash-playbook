---

description: Server agent for collecting metrics
docs:
  name: Telegraf
  url: https://www.influxdata.com/time-series-platform/telegraf/
  section: foss
activation_prefix: telegraf_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ telegraf_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ telegraf_restart_necessary | bool }}"
        groups: [mash, telegraf]
        when: "{{ telegraf_enabled }}"
