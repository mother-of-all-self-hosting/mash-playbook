---

docuseal_database_postgres_hostname: "{{ postgres_connection_hostname if postgres_enabled else '' }}"
docuseal_database_postgres_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
docuseal_database_postgres_password: "{{ (mash_playbook_generic_secret_key + ':db.docuseal.p') | hash('sha512') | to_uuid }}"
docuseal_database_postgres_sslmode: "{{ 'disable' if postgres_enabled and (docuseal_database_postgres_hostname == postgres_connection_hostname or docuseal_database_postgres_socket_enabled) else 'prefer' }}"
docuseal_database_postgres_socket_path_host: "{{ postgres_run_path }}"
