---

docuseal_database_mysql_hostname: "{{ mariadb_connection_hostname if mariadb_enabled else '' }}"
docuseal_database_mysql_port: "{{ mariadb_connection_port if mariadb_enabled else '3306' }}"
docuseal_database_mysql_password: "{{ (mash_playbook_generic_secret_key + ':db.docuseal.ma') | hash('sha512') | to_uuid }}"
docuseal_database_mysql_socket_path_host: "{{ mariadb_run_path }}"
