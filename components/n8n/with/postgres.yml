---

n8n_database_hostname: "{{ postgres_connection_hostname if postgres_enabled and not n8n_database_socket_enabled else '' }}"
n8n_database_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
n8n_database_password: "{{ (mash_playbook_generic_secret_key + ':n8n.db') | hash('sha512') | to_uuid }}"
n8n_database_socket_path_host: "{{ postgres_run_path }}"
