---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
n8n_enabled: false

n8n_identifier: "{{ mash_playbook_service_identifier_prefix }}n8n"

n8n_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}n8n"

# Runs as 1000:1000
n8n_uid: "1000"
n8n_gid: "1000"

n8n_systemd_required_services_list_auto: |
  {{
    ([postgres_identifier ~ '.service'] if postgres_enabled | default(false) and (n8n_database_hostname == postgres_connection_hostname or n8n_database_socket_enabled) and n8n_database_type == 'postgres' else [])
  }}

n8n_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgres_container_network] if postgres_enabled | default(false) and (n8n_database_hostname == postgres_connection_hostname and n8n_container_network != postgres_container_network and not n8n_database_socket_enabled) and n8n_database_type == 'postgres' else [])
  }}

n8n_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
n8n_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"

n8n_container_labels_traefik_metrics_enabled: "{{ n8n_environment_variables_n8n_metrics and mash_playbook_metrics_exposure_enabled }}"
n8n_container_labels_traefik_metrics_hostname: "{{ mash_playbook_metrics_exposure_hostname }}"
n8n_container_labels_traefik_metrics_path_prefix: "{{ mash_playbook_metrics_exposure_path_prefix }}/{{ n8n_identifier }}"
n8n_container_labels_traefik_metrics_middleware_basic_auth_enabled: "{{ mash_playbook_metrics_exposure_http_basic_auth_enabled }}"
n8n_container_labels_traefik_metrics_middleware_basic_auth_users: "{{ mash_playbook_metrics_exposure_http_basic_auth_users }}"

n8n_environment_variables_n8n_metrics: "{{ prometheus_enabled | default(false) or mash_playbook_metrics_exposure_enabled }}"
