---

description: Exporter for machine metrics
docs:
  name: Prometheus Node Exporter
  url: https://github.com/prometheus/node_exporter
  section: foss
activation_prefix: prometheus_node_exporter_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ prometheus_node_exporter_identifier }}.service"
        priority: 500
        restart_necessary: "{{ prometheus_node_exporter_restart_necessary | bool }}"
        groups: [mash, metrics, prometheus-node-exporter]
        when: "{{ prometheus_node_exporter_enabled }}"
