---

activation_prefix: dokuwiki_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ dokuwiki_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ dokuwiki_restart_necessary | bool }}"
        groups: [mash, dokuwiki]
        when: "{{ dokuwiki_enabled }}"
