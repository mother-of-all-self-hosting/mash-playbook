---

activation_prefix: filegator_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ filegator_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ filegator_restart_necessary | bool }}"
        groups: [mash, filegator]
        when: "{{ filegator_enabled }}"
