---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
etherpad_enabled: false

etherpad_identifier: "{{ mash_playbook_service_identifier_prefix }}etherpad"

etherpad_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}etherpad"

etherpad_uid: "{{ mash_playbook_uid }}"
etherpad_gid: "{{ mash_playbook_gid }}"

etherpad_systemd_required_services_list_auto: |
  {{
    ([couchdb_identifier ~ '.service'] if couchdb_enabled | default(false) and etherpad_database_couchdb_hostname == couchdb_connection_hostname and etherpad_database_type == 'couchdb' else [])
    +
    ([mariadb_identifier ~ '.service'] if mariadb_enabled | default(false) and (etherpad_database_mysql_hostname == mariadb_connection_hostname or etherpad_database_mysql_socket_enabled) and etherpad_database_type == 'mysql' else [])
    +
    ([postgres_identifier ~ '.service'] if postgres_enabled | default(false) and etherpad_database_postgres_hostname == postgres_connection_hostname and etherpad_database_type == 'postgres' else [])
  }}

etherpad_container_additional_networks_auto: |
  {{
    ([couchdb_container_network] if couchdb_enabled | default(false) and etherpad_database_couchdb_hostname == couchdb_connection_hostname and etherpad_container_network != couchdb_container_network and etherpad_database_type == 'couchdb' else [])
    +
    ([mariadb_container_network] if mariadb_enabled | default(false) and (etherpad_database_mysql_hostname == mariadb_connection_hostname and etherpad_container_network != mariadb_container_network and not etherpad_database_mysql_socket_enabled) and etherpad_database_type == 'mysql' else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgres_container_network] if postgres_enabled | default(false) and etherpad_database_postgres_hostname == postgres_connection_hostname and etherpad_container_network != postgres_container_network and etherpad_database_type == 'postgres' else [])
  }}

etherpad_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
etherpad_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"

etherpad_container_labels_traefik_metrics_enabled: "{{ mash_playbook_metrics_exposure_enabled }}"
etherpad_container_labels_traefik_metrics_hostname: "{{ mash_playbook_metrics_exposure_hostname }}"
etherpad_container_labels_traefik_metrics_path_prefix: "{{ mash_playbook_metrics_exposure_path_prefix }}/{{ etherpad_identifier }}"
etherpad_container_labels_traefik_metrics_middleware_basic_auth_enabled: "{{ mash_playbook_metrics_exposure_http_basic_auth_enabled }}"
etherpad_container_labels_traefik_metrics_middleware_basic_auth_users: "{{ mash_playbook_metrics_exposure_http_basic_auth_users }}"
