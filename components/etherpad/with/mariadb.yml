---

etherpad_database_mysql_hostname: "{{ mariadb_connection_hostname if mariadb_enabled and not etherpad_database_mysql_socket_enabled else '' }}"
etherpad_database_mysql_port: "{{ mariadb_connection_port if mariadb_enabled else '3306' }}"
etherpad_database_mysql_username: "{{ etherpad_identifier }}"
etherpad_database_mysql_password: "{{ (mash_playbook_generic_secret_key + ':db.etherpad.ma') | hash('sha512') | to_uuid }}"
etherpad_database_mysql_socket_path_host: "{{ mariadb_run_path }}"
