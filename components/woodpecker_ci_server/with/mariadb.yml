---

woodpecker_ci_server_database_mysql_hostname: "{{ woodpecker_ci_server_database_mysql_socket_path_container + '/mysqld.sock' if woodpecker_ci_server_database_mysql_socket_enabled else (mariadb_connection_hostname if mariadb_enabled else '') }}"
woodpecker_ci_server_database_mysql_port: "{{ mariadb_connection_port if mariadb_enabled else '3306' }}"
woodpecker_ci_server_database_mysql_password: "{{ (mash_playbook_generic_secret_key + ':woodpecker.ci') | hash('sha512') | to_uuid }}"
woodpecker_ci_server_database_mysql_socket_path_host: "{{ mariadb_run_path }}"
