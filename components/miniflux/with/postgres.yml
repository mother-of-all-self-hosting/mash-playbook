---

miniflux_database_hostname: "{{ postgres_connection_hostname if postgres_enabled and not miniflux_database_socket_enabled else '' }}"
miniflux_database_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
miniflux_database_password: "{{ (mash_playbook_generic_secret_key + ':miniflux.db') | hash('sha512') | to_uuid }}"
miniflux_database_sslmode: "{{ 'disable' if postgres_enabled and (miniflux_database_hostname == postgres_connection_hostname or miniflux_database_socket_enabled) else 'prefer' }}"
miniflux_database_socket_path_host: "{{ postgres_run_path }}"
