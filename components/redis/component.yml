---

activation_prefix: redis_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ redis_identifier }}.service"
        priority: 750
        restart_necessary: "{{ redis_restart_necessary | bool }}"
        groups: [mash, redis]
        when: "{{ redis_enabled }}"
