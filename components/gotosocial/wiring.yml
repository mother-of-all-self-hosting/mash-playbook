---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
gotosocial_enabled: false

gotosocial_identifier: "{{ mash_playbook_service_identifier_prefix }}gotosocial"

gotosocial_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}gotosocial"

gotosocial_uid: "{{ mash_playbook_uid }}"
gotosocial_gid: "{{ mash_playbook_gid }}"

gotosocial_systemd_required_services_list_auto: |
  {{
    ([postgres_identifier ~ '.service'] if postgres_enabled | default(false) and (gotosocial_database_hostname == postgres_connection_hostname or gotosocial_database_socket_enabled) and gotosocial_database_type == 'postgres' else [])
  }}

gotosocial_systemd_wanted_services_list_auto: |
  {{
    ([exim_relay_identifier ~ '.service'] if exim_relay_enabled | default(false) and gotosocial_environment_variables_gts_smtp_host == exim_relay_identifier else [])
  }}

gotosocial_container_additional_networks_auto: |
  {{
    ([exim_relay_container_network] if exim_relay_enabled | default(false) and gotosocial_environment_variables_gts_smtp_host == exim_relay_identifier and gotosocial_container_network != exim_relay_container_network else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgres_container_network] if postgres_enabled | default(false) and (gotosocial_database_hostname == postgres_connection_hostname and gotosocial_container_network != postgres_container_network and not gotosocial_database_socket_enabled) and gotosocial_database_type == 'postgres' else [])
  }}

gotosocial_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
gotosocial_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"

gotosocial_container_labels_traefik_metrics_enabled: "{{ gotosocial_metrics_enabled and mash_playbook_metrics_exposure_enabled }}"
gotosocial_container_labels_traefik_metrics_hostname: "{{ mash_playbook_metrics_exposure_hostname }}"
gotosocial_container_labels_traefik_metrics_path_prefix: "{{ mash_playbook_metrics_exposure_path_prefix }}/{{ gotosocial_identifier }}"
gotosocial_container_labels_traefik_metrics_middleware_basic_auth_enabled: "{{ mash_playbook_metrics_exposure_http_basic_auth_enabled }}"
gotosocial_container_labels_traefik_metrics_middleware_basic_auth_users: "{{ mash_playbook_metrics_exposure_http_basic_auth_users }}"

gotosocial_metrics_enabled: "{{ prometheus_enabled | default(false) or mash_playbook_metrics_exposure_enabled }}"
