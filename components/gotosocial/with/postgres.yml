---

gotosocial_database_hostname: "{{ postgres_connection_hostname if postgres_enabled and not gotosocial_database_socket_enabled else '' }}"
gotosocial_database_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
gotosocial_database_username: "{{ gotosocial_identifier }}"
gotosocial_database_password: "{{ (mash_playbook_generic_secret_key + ':db.gotosocial') | hash('sha512') | to_uuid }}"
gotosocial_database_sslmode: "{{ 'disable' if postgres_enabled and (gotosocial_database_hostname == postgres_connection_hostname or gotosocial_database_socket_enabled) else 'enable' }}"
gotosocial_database_socket_path_host: "{{ postgres_run_path }}"
