---

activation_prefix: woodpecker_ci_agent_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ woodpecker_ci_agent_identifier }}.service"
        priority: 4100
        restart_necessary: "{{ woodpecker_ci_agent_restart_necessary | bool }}"
        groups: [mash, woodpecker, ci, woodpecker-ci-agent]
        when: "{{ woodpecker_ci_agent_enabled }}"
