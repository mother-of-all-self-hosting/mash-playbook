---

mumble_database_mysql_hostname: "{{ mariadb_connection_hostname if mariadb_enabled else '' }}"
mumble_database_mysql_port: "{{ mariadb_connection_port if mariadb_enabled else '3306' }}"
mumble_database_mysql_password: "{{ (mash_playbook_generic_secret_key + ':db.mumble') | hash('sha512') | to_uuid }}"
mumble_database_mysql_socket_path_host: "{{ mariadb_run_path }}"
