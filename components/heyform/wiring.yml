---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
heyform_enabled: false

heyform_identifier: "{{ mash_playbook_service_identifier_prefix }}heyform"

heyform_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}heyform"

heyform_uid: "{{ mash_playbook_uid }}"
heyform_gid: "{{ mash_playbook_gid }}"

heyform_systemd_required_services_list_auto: |
  {{
    ([mongodb_identifier ~ '.service'] if mongodb_enabled and heyform_database_hostname == mongodb_connection_hostname else [])
  }}

heyform_systemd_wanted_services_list_auto: |
  {{
    ([exim_relay_identifier ~ '.service'] if exim_relay_enabled | default(false) else [])
  }}

heyform_container_additional_networks_auto: |
  {{
    ([exim_relay_container_network] if exim_relay_enabled | default(false) and heyform_container_network != exim_relay_container_network else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([mongodb_container_network] if mongodb_enabled and heyform_database_hostname == mongodb_connection_hostname and heyform_container_network != mongodb_container_network else [])
  }}

heyform_environment_variables_session_key: "{{ (mash_playbook_generic_secret_key + ':heyform.s') | hash('sha512') | to_uuid }}"

heyform_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
heyform_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
