---

heyform_environment_variables_smtp_host: "{{ exim_relay_identifier if exim_relay_enabled else '' }}"
heyform_environment_variables_smtp_port: "{{ '8025' if exim_relay_enabled else '587' }}"
heyform_environment_variables_smtp_from: "{{ exim_relay_sender_address if exim_relay_enabled else '' }}"
heyform_environment_variables_smtp_secure: "{{ false if exim_relay_enabled else true }}"
