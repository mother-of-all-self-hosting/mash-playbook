---

activation_prefix: appsmith_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ appsmith_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ appsmith_restart_necessary | bool }}"
        groups: [mash, appsmith]
        when: "{{ appsmith_enabled }}"
  hubsite:
    services:
      - name: "{{ mash_playbook_hubsite_service_appsmith_name }}"
        url: "{{ mash_playbook_hubsite_service_appsmith_url }}"
        logo_location: "{{ mash_playbook_hubsite_service_appsmith_logo_location }}"
        description: "{{ mash_playbook_hubsite_service_appsmith_description }}"
        priority: "{{ mash_playbook_hubsite_service_appsmith_priority }}"
        when: "{{ mash_playbook_hubsite_service_appsmith_enabled }}"
