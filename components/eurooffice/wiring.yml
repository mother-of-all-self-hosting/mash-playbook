---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
eurooffice_enabled: false

eurooffice_identifier: "{{ mash_playbook_service_identifier_prefix }}eurooffice"

eurooffice_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}eurooffice"

# Run as root
eurooffice_uid: "0"
eurooffice_gid: "0"

eurooffice_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

eurooffice_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
eurooffice_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"

eurooffice_environment_variables_jwt_secret: "{{ (mash_playbook_generic_secret_key + ':onlyoffice.j') | hash('sha512') | to_uuid }}"
