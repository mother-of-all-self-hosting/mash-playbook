---

linkwarden_database_hostname: "{{ postgres_connection_hostname if postgres_enabled else '' }}"
linkwarden_database_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
linkwarden_database_password: "{{ (mash_playbook_generic_secret_key + ':linkwarden.db') | hash('sha512') | to_uuid }}"
linkwarden_database_sslmode: "{{ 'disable' if postgres_enabled and (linkwarden_database_hostname == postgres_connection_hostname or linkwarden_database_socket_enabled) else 'prefer' }}"
linkwarden_database_socket_path_host: "{{ postgres_run_path }}"
