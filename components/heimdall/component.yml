---

activation_prefix: heimdall_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ heimdall_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ heimdall_restart_necessary | bool }}"
        groups: [mash, heimdall]
        when: "{{ heimdall_enabled }}"
