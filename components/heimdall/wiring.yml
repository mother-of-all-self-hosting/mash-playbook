---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
heimdall_enabled: false

heimdall_identifier: "{{ mash_playbook_service_identifier_prefix }}heimdall"

heimdall_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}heimdall"

heimdall_uid: "{{ mash_playbook_uid }}"
heimdall_gid: "{{ mash_playbook_gid }}"

heimdall_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

heimdall_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
heimdall_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
