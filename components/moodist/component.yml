---

activation_prefix: moodist_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ moodist_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ moodist_restart_necessary | bool }}"
        groups: [mash, moodist]
        when: "{{ moodist_enabled }}"
