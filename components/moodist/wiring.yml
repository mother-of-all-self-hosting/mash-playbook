---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
moodist_enabled: false

moodist_identifier: "{{ mash_playbook_service_identifier_prefix }}moodist"

moodist_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}moodist"

# The default Docker image requires root user
moodist_uid: "{{ mash_playbook_uid if moodist_container_image_self_build else '0' }}"
moodist_gid: "{{ mash_playbook_gid if moodist_container_image_self_build else '0' }}"

moodist_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

moodist_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
moodist_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
