---

activation_prefix: filebrowser_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ filebrowser_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ filebrowser_restart_necessary | bool }}"
        groups: [mash, filebrowser]
        when: "{{ filebrowser_enabled }}"
