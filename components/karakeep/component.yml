---

description: Bookmark manager to collect, organize and archive webpages
docs:
  name: Karakeep
  url: https://karakeep.app/
  section: foss
activation_prefix: karakeep_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ karakeep_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ karakeep_restart_necessary | bool }}"
        groups: [mash, karakeep]
        when: "{{ karakeep_enabled }}"
