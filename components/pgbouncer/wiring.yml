---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
pgbouncer_enabled: false

pgbouncer_identifier: "{{ mash_playbook_service_identifier_prefix }}pgbouncer"

pgbouncer_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}pgbouncer"

pgbouncer_uid: "{{ mash_playbook_uid }}"
pgbouncer_gid: "{{ mash_playbook_gid }}"

pgbouncer_systemd_required_services_list_auto: |
  {{
    ([postgres_identifier ~ '.service'] if postgres_enabled and (pgbouncer_environment_variables_databases_host == postgres_connection_hostname or pgbouncer_database_socket_enabled) else [])
  }}

pgbouncer_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgres_container_network] if postgres_enabled and (pgbouncer_environment_variables_databases_host == postgres_connection_hostname and pgbouncer_container_network != postgres_container_network and not pgbouncer_database_socket_enabled) else [])
  }}
