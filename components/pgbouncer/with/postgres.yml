---
# Use the same default port as Postgres
pgbouncer_connection_port: "{{ postgres_connection_port if postgres_enabled }}"

pgbouncer_environment_variables_databases_host: "{{ pgbouncer_database_socket_path_container if postgres_enabled and pgbouncer_database_socket_enabled else '' }}"
pgbouncer_environment_variables_databases_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
pgbouncer_environment_variables_databases_user: "{{ postgres_connection_username if postgres_enabled else '' }}"
pgbouncer_environment_variables_databases_password: "{{ postgres_connection_password if postgres_enabled else '' }}"
pgbouncer_environment_variables_pgbouncer_server_tls_sslmode: "{{ 'disable' if postgres_enabled and (pgbouncer_environment_variables_databases_host == postgres_connection_hostname or pgbouncer_database_socket_enabled) else 'prefer' }}"
pgbouncer_database_socket_path_host: "{{ postgres_run_path }}"
