---

freescout_database_postgres_hostname: "{{ postgres_connection_hostname if postgres_enabled and not freescout_database_postgres_socket_enabled else '' }}"
freescout_database_postgres_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
freescout_database_postgres_password: "{{ (mash_playbook_generic_secret_key + ':freescout.db') | hash('sha512') | to_uuid }}"
freescout_database_postgres_sslmode: "{{ 'disable' if postgres_enabled and (freescout_database_postgres_hostname == postgres_connection_hostname or freescout_database_postgres_socket_enabled) else 'enable' }}"
freescout_database_postgres_socket_path_host: "{{ postgres_run_path }}"
