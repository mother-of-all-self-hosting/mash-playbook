---

activation_prefix: meilisearch_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ meilisearch_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ meilisearch_restart_necessary | bool }}"
        groups: [mash, meilisearch]
        when: "{{ meilisearch_enabled }}"
