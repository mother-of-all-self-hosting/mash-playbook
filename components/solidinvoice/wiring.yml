---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
solidinvoice_enabled: false

solidinvoice_identifier: "{{ mash_playbook_service_identifier_prefix }}solidinvoice"

solidinvoice_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}solidinvoice"

solidinvoice_uid: "{{ mash_playbook_uid }}"
solidinvoice_gid: "{{ mash_playbook_gid }}"

solidinvoice_systemd_required_services_list_auto: |
  {{
    ([mariadb_identifier ~ '.service'] if mariadb_enabled | default(false) and solidinvoice_database_mysql_hostname == mariadb_connection_hostname and solidinvoice_database_type == 'mysql' else [])
    +
    ([postgres_identifier ~ '.service'] if postgres_enabled | default(false) and solidinvoice_database_postgres_hostname == postgres_connection_hostname and solidinvoice_database_type == 'postgres' else [])
  }}

solidinvoice_systemd_wanted_services_list_auto: |
  {{
    ([exim_relay_identifier ~ '.service'] if exim_relay_enabled | default(false) else [])
  }}

solidinvoice_container_additional_networks_auto: |
  {{
    ([exim_relay_container_network] if exim_relay_enabled | default(false) and solidinvoice_container_network != exim_relay_container_network else [])
    +
    ([mariadb_container_network] if mariadb_enabled | default(false) and solidinvoice_database_mysql_hostname == mariadb_connection_hostname and solidinvoice_container_network != mariadb_container_network and solidinvoice_database_type == 'mysql' else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgres_container_network] if postgres_enabled | default(false) and solidinvoice_database_postgres_hostname == postgres_connection_hostname and solidinvoice_container_network != postgres_container_network and solidinvoice_database_type == 'postgres' else [])
  }}

solidinvoice_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
solidinvoice_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
