---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
yggstack_enabled: false

yggstack_identifier: "{{ mash_playbook_service_identifier_prefix }}yggstack"

yggstack_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}yggstack"

# Run as root
yggstack_uid: 0
yggstack_gid: 0

yggstack_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}
