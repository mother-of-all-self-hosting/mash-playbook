---

description: Pass-through Docker registry proxy with metadata caching
docs:
  name: Docker Registry Proxy
  url: https://github.com/etkecc/docker-registry-proxy
  section: foss
activation_prefix: docker_registry_proxy_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ docker_registry_proxy_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ docker_registry_proxy_restart_necessary | bool }}"
        groups: [mash, docker-registry-proxy]
        when: "{{ docker_registry_proxy_enabled }}"
