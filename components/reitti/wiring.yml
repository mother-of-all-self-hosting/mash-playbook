---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
reitti_enabled: false

reitti_identifier: "{{ mash_playbook_service_identifier_prefix }}reitti"

reitti_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}reitti"

reitti_uid: "{{ mash_playbook_uid }}"
reitti_gid: "{{ mash_playbook_gid }}"

reitti_systemd_required_services_list_auto: |
  {{
    ([postgis_identifier ~ '.service'] if postgis_enabled and reitti_database_hostname == postgis_connection_hostname else [])
  }}

reitti_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgis_container_network] if postgis_enabled and reitti_database_hostname == postgis_connection_hostname and reitti_container_network != postgis_container_network else [])
  }}

reitti_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
reitti_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
