---

description: Login screen or OAuth authentication middleware for Docker services
docs:
  name: Tinyauth
  url: https://tinyauth.app/
  section: foss
activation_prefix: tinyauth_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ tinyauth_identifier }}.service"
        priority: 1900
        restart_necessary: "{{ tinyauth_restart_necessary | bool }}"
        groups: [mash, tinyauth]
        when: "{{ tinyauth_enabled }}"
  postgres:
    managed_databases:
      - name: "{{ tinyauth_database_name }}"
        username: "{{ tinyauth_database_username }}"
        password: "{{ tinyauth_database_password }}"
        when: "{{ tinyauth_enabled and (tinyauth_database_hostname == postgres_connection_hostname or tinyauth_database_socket_enabled) and tinyauth_database_type == 'postgres' }}"
