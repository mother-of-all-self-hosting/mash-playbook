---

activation_prefix: cryptpad_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ cryptpad_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ cryptpad_restart_necessary | bool }}"
        groups: [mash, cryptpad]
        when: "{{ cryptpad_enabled }}"
