---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
gotenberg_enabled: false

gotenberg_identifier: "{{ mash_playbook_service_identifier_prefix }}gotenberg"

gotenberg_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}gotenberg"

gotenberg_uid: "{{ mash_playbook_uid }}"
gotenberg_gid: "{{ mash_playbook_gid }}"

gotenberg_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

# Only enable Traefik labels if a hostname is set (indicating that this will be exposed publicly)
gotenberg_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled and gotenberg_hostname | length > 0 }}"
gotenberg_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"

gotenberg_container_labels_traefik_metrics_enabled: "{{ mash_playbook_metrics_exposure_enabled }}"
gotenberg_container_labels_traefik_metrics_hostname: "{{ mash_playbook_metrics_exposure_hostname }}"
gotenberg_container_labels_traefik_metrics_path_prefix: "{{ mash_playbook_metrics_exposure_path_prefix }}/{{ gotenberg_identifier }}"
gotenberg_container_labels_traefik_metrics_middleware_basic_auth_enabled: "{{ mash_playbook_metrics_exposure_http_basic_auth_enabled }}"
gotenberg_container_labels_traefik_metrics_middleware_basic_auth_users: "{{ mash_playbook_metrics_exposure_http_basic_auth_users }}"
