---

activation_prefix: gotenberg_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ gotenberg_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ gotenberg_restart_necessary | bool }}"
        groups: [mash, gotenberg]
        when: "{{ gotenberg_enabled }}"
