---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
mazanoke_enabled: false

mazanoke_identifier: "{{ mash_playbook_service_identifier_prefix }}mazanoke"

mazanoke_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}mazanoke"

mazanoke_uid: "{{ mash_playbook_uid }}"
mazanoke_gid: "{{ mash_playbook_gid }}"

mazanoke_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

mazanoke_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
mazanoke_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
