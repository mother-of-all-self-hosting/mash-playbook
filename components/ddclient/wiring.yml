---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
ddclient_enabled: false

ddclient_identifier: "{{ mash_playbook_service_identifier_prefix }}ddclient"

ddclient_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}ddclient"

ddclient_uid: "{{ mash_playbook_uid }}"
ddclient_gid: "{{ mash_playbook_gid }}"
