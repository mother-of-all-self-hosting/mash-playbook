---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
flaresolverr_enabled: false

flaresolverr_identifier: "{{ mash_playbook_service_identifier_prefix }}flaresolverr"

flaresolverr_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}flaresolverr"

flaresolverr_uid: "{{ mash_playbook_uid }}"
flaresolverr_gid: "{{ mash_playbook_gid }}"

flaresolverr_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

# Only enable Traefik labels if a hostname is set (indicating that this will be exposed publicly)
flaresolverr_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled and flaresolverr_hostname | length > 0 }}"
flaresolverr_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"

flaresolverr_container_labels_traefik_metrics_enabled: "{{ flaresolverr_environment_variables_prometheus_enabled and mash_playbook_metrics_exposure_enabled }}"
flaresolverr_container_labels_traefik_metrics_hostname: "{{ mash_playbook_metrics_exposure_hostname }}"
flaresolverr_container_labels_traefik_metrics_path_prefix: "{{ mash_playbook_metrics_exposure_path_prefix }}/{{ flaresolverr_identifier }}"
flaresolverr_container_labels_traefik_metrics_middleware_basic_auth_enabled: "{{ mash_playbook_metrics_exposure_http_basic_auth_enabled }}"
flaresolverr_container_labels_traefik_metrics_middleware_basic_auth_users: "{{ mash_playbook_metrics_exposure_http_basic_auth_users }}"

flaresolverr_environment_variables_prometheus_enabled: "{{ prometheus_enabled | default(false) or mash_playbook_metrics_exposure_enabled }}"
