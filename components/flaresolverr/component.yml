---

description: A proxy server to bypass Cloudflare protection
docs:
  name: FlareSolverr
  url: https://github.com/FlareSolverr/FlareSolverr
  section: foss
activation_prefix: flaresolverr_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ flaresolverr_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ flaresolverr_restart_necessary | bool }}"
        groups: [mash, flaresolverr]
        when: "{{ flaresolverr_enabled }}"
