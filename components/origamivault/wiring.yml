---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
origamivault_enabled: false

origamivault_identifier: "{{ mash_playbook_service_identifier_prefix }}origamivault"

origamivault_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}origamivault"

origamivault_uid: "{{ mash_playbook_uid }}"
origamivault_gid: "{{ mash_playbook_gid }}"

origamivault_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

origamivault_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
origamivault_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
