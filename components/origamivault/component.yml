---

activation_prefix: origamivault_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ origamivault_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ origamivault_restart_necessary | bool }}"
        groups: [mash, origamivault]
        when: "{{ origamivault_enabled }}"
