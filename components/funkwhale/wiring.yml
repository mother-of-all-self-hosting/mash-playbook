---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
funkwhale_enabled: false

funkwhale_identifier: "{{ mash_playbook_service_identifier_prefix }}funkwhale"

funkwhale_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}funkwhale"

funkwhale_uid: "{{ mash_playbook_uid }}"
funkwhale_gid: "{{ mash_playbook_gid }}"

funkwhale_api_systemd_required_services_list_auto: |
  {{
    ([postgres_identifier ~ '.service'] if postgres_enabled and (funkwhale_database_hostname == postgres_connection_hostname or funkwhale_database_socket_enabled) else [])
  }}

funkwhale_api_systemd_wanted_services_list_auto: |
  {{
    ([exim_relay_identifier ~ '.service'] if exim_relay_enabled | default(false) and funkwhale_api_environment_variables_email_config_host == exim_relay_identifier else [])
  }}

funkwhale_frontend_systemd_required_services_list_auto: |
  {{
    ([postgres_identifier ~ '.service'] if postgres_enabled and (funkwhale_database_hostname == postgres_connection_hostname or funkwhale_database_socket_enabled) else [])
  }}

funkwhale_api_container_additional_networks_auto: |
  {{
    ([exim_relay_container_network] if exim_relay_enabled | default(false) and funkwhale_api_environment_variables_email_config_host == exim_relay_identifier and funkwhale_api_container_network != exim_relay_container_network else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgres_container_network] if postgres_enabled and (funkwhale_database_hostname == postgres_connection_hostname and funkwhale_api_container_network != postgres_container_network and not funkwhale_database_socket_enabled) else [])
  }}

funkwhale_frontend_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgres_container_network] if postgres_enabled and (funkwhale_database_hostname == postgres_connection_hostname and funkwhale_frontend_container_network != postgres_container_network and not funkwhale_database_socket_enabled) else [])
  }}

funkwhale_frontend_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
funkwhale_frontend_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
