---

description: Web server for static file-serving
docs:
  name: Static Web Server
  url: https://static-web-server.net/
  section: foss
activation_prefix: static_web_server_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ static_web_server_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ static_web_server_restart_necessary | bool }}"
        groups: [mash, static-web-server]
        when: "{{ static_web_server_enabled }}"
