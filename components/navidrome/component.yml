---

activation_prefix: navidrome_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ navidrome_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ navidrome_restart_necessary | bool }}"
        groups: [mash, navidrome]
        when: "{{ navidrome_enabled }}"
  hubsite:
    services:
      - name: "{{ hubsite_service_navidrome_name }}"
        url: "{{ hubsite_service_navidrome_url }}"
        logo_location: "{{ hubsite_service_navidrome_logo_location }}"
        description: "{{ hubsite_service_navidrome_description }}"
        priority: "{{ hubsite_service_navidrome_priority }}"
        when: "{{ hubsite_service_navidrome_enabled }}"
