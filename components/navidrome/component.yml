---

activation_prefix: navidrome_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ navidrome_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ navidrome_restart_necessary | bool }}"
        groups: [mash, navidrome]
        when: "{{ navidrome_enabled }}"
  hubsite:
    services:
      - name: "{{ mash_playbook_hubsite_service_navidrome_name }}"
        url: "{{ mash_playbook_hubsite_service_navidrome_url }}"
        logo_location: "{{ mash_playbook_hubsite_service_navidrome_logo_location }}"
        description: "{{ mash_playbook_hubsite_service_navidrome_description }}"
        priority: "{{ mash_playbook_hubsite_service_navidrome_priority }}"
        when: "{{ mash_playbook_hubsite_service_navidrome_enabled }}"
