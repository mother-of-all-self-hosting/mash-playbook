---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
phpmyadmin_enabled: false

phpmyadmin_identifier: "{{ mash_playbook_service_identifier_prefix }}phpmyadmin"

phpmyadmin_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}phpmyadmin"

# phpMyAdmin requires www-data:www-data to be set
phpmyadmin_uid: "33"
phpmyadmin_gid: "33"

phpmyadmin_systemd_required_services_list_auto: |
  {{
    ([mariadb_identifier ~ '.service'] if mariadb_enabled else [])
  }}

phpmyadmin_container_additional_networks_auto: |
  {{
    ([mariadb_container_network] if mariadb_enabled and phpmyadmin_container_network != mariadb_container_network and not phpmyadmin_socket_enabled else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

phpmyadmin_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
phpmyadmin_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
