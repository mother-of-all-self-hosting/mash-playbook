---

activation_prefix: memcached_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ memcached_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ memcached_restart_necessary | bool }}"
        groups: [mash, memcached]
        when: "{{ memcached_enabled }}"
