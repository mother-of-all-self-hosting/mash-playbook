---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
pinepods_enabled: false

pinepods_identifier: "{{ mash_playbook_service_identifier_prefix }}pinepods"

pinepods_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}pinepods"

pinepods_uid: "{{ mash_playbook_uid }}"
pinepods_gid: "{{ mash_playbook_gid }}"

pinepods_systemd_required_services_list_auto: |
  {{
    ([mariadb_identifier ~ '.service'] if mariadb_enabled | default(false) and pinepods_database_mariadb_hostname == mariadb_connection_hostname and pinepods_database_type == 'mariadb' else [])
    +
    ([postgres_identifier ~ '.service'] if postgres_enabled | default(false) and pinepods_database_postgres_hostname == postgres_connection_hostname and pinepods_database_type == 'postgres' else [])
  }}

pinepods_systemd_wanted_services_list_auto: |
  {{
    ([exim_relay_identifier ~ '.service'] if exim_relay_enabled | default(false) else [])
    +
    ([gotify_identifier ~ '.service'] if gotify_enabled | default(false) else [])
    +
    ([ntfy_identifier ~ '.service'] if ntfy_enabled | default(false) else [])
  }}

pinepods_container_additional_networks_auto: |
  {{
    ([exim_relay_container_network] if exim_relay_enabled | default(false) and pinepods_container_network != exim_relay_container_network else [])
    +
    ([gotify_container_network] if gotify_enabled | default(false) and pinepods_container_network != gotify_container_network else [])
    +
    ([mariadb_container_network] if mariadb_enabled | default(false) and pinepods_database_mariadb_hostname == mariadb_connection_hostname and pinepods_container_network != mariadb_container_network and pinepods_database_type == 'mariadb' else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([ntfy_container_network] if ntfy_enabled | default(false) and pinepods_container_network != ntfy_container_network else [])
    +
    ([postgres_container_network] if postgres_enabled | default(false) and pinepods_database_postgres_hostname == postgres_connection_hostname and pinepods_container_network != postgres_container_network and pinepods_database_type == 'postgres' else [])
  }}

pinepods_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
pinepods_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
