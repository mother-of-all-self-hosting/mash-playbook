---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
openregex_enabled: false

openregex_identifier: "{{ mash_playbook_service_identifier_prefix }}openregex"

openregex_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}openregex"

openregex_uid: "{{ mash_playbook_uid }}"
openregex_gid: "{{ mash_playbook_gid }}"

openregex_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

openregex_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
openregex_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
