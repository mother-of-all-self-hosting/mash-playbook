---

activation_prefix: openregex_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ openregex_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ openregex_restart_necessary | bool }}"
        groups: [mash, openregex]
        when: "{{ openregex_enabled }}"
