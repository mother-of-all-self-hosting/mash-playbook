---

readeck_database_hostname: "{{ postgres_connection_hostname if postgres_enabled else '' }}"
readeck_database_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
readeck_database_password: "{{ (mash_playbook_generic_secret_key + ':readeck.db') | hash('sha512') | to_uuid }}"
readeck_database_sslmode: "{{ 'disable' if postgres_enabled and (readeck_database_hostname == postgres_connection_hostname or readeck_database_socket_enabled) else 'prefer' }}"
readeck_database_socket_path_host: "{{ postgres_run_path }}"
