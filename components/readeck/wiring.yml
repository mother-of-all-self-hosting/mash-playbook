---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
readeck_enabled: false

readeck_identifier: "{{ mash_playbook_service_identifier_prefix }}readeck"

readeck_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}readeck"

readeck_uid: "{{ mash_playbook_uid }}"
readeck_gid: "{{ mash_playbook_gid }}"

readeck_systemd_required_services_list_auto: |
  {{
    ([postgres_identifier ~ '.service'] if postgres_enabled | default(false) and (readeck_database_hostname == postgres_connection_hostname or readeck_database_socket_enabled) and readeck_database_type == 'postgres' else [])
  }}

readeck_systemd_wanted_services_list_auto: |
  {{
    ([exim_relay_identifier ~ '.service'] if exim_relay_enabled | default(false) and readeck_environment_variables_readeck_mail_host == exim_relay_identifier else [])
  }}

readeck_container_additional_networks_auto: |
  {{
    ([exim_relay_container_network] if exim_relay_enabled | default(false) and readeck_environment_variables_readeck_mail_host == exim_relay_identifier and readeck_container_network != exim_relay_container_network else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgres_container_network] if postgres_enabled | default(false) and (readeck_database_hostname == postgres_connection_hostname and readeck_container_network != postgres_container_network and not readeck_database_socket_enabled) and readeck_database_type == 'postgres' else [])
  }}

readeck_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
readeck_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
