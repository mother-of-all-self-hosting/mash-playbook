---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
ihatemoney_enabled: false

ihatemoney_identifier: "{{ mash_playbook_service_identifier_prefix }}ihatemoney"

ihatemoney_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}ihatemoney"

ihatemoney_uid: "{{ mash_playbook_uid }}"
ihatemoney_gid: "{{ mash_playbook_gid }}"

ihatemoney_systemd_required_services_list_auto: |
  {{
    ([postgres_identifier ~ '.service'] if postgres_enabled | default(false) and (ihatemoney_database_postgres_hostname == postgres_connection_hostname or ihatemoney_database_postgres_socket_enabled) and ihatemoney_database_type == 'postgres' else [])
    +
    ([mariadb_identifier ~ '.service'] if mariadb_enabled | default(false) and (ihatemoney_database_mysql_hostname == mariadb_connection_hostname or ihatemoney_database_mysql_socket_enabled) and ihatemoney_database_type == 'mysql' else [])
  }}

ihatemoney_systemd_wanted_services_list_auto: |
  {{
    ([exim_relay_identifier ~ '.service'] if exim_relay_enabled | default(false) and ihatemoney_email_host == exim_relay_identifier else [])
  }}

ihatemoney_container_additional_networks_auto: |
  {{
    (
      ([exim_relay_container_network] if exim_relay_enabled | default(false) and ihatemoney_email_host == exim_relay_identifier and ihatemoney_container_network != exim_relay_container_network else [])
      +
      ([mariadb_container_network] if mariadb_enabled | default(false) and (ihatemoney_database_mysql_hostname == mariadb_connection_hostname and ihatemoney_container_network != mariadb_container_network and not ihatemoney_database_mysql_socket_enabled) and ihatemoney_database_type == 'mysql' else [])
      +
      ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
      +
      ([postgres_container_network] if postgres_enabled | default(false) and (ihatemoney_database_postgres_hostname == postgres_connection_hostname and ihatemoney_container_network != postgres_container_network and not ihatemoney_database_postgres_socket_enabled) and ihatemoney_database_type == 'postgres' else [])
    ) | unique
  }}

ihatemoney_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
ihatemoney_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"

ihatemoney_environment_variable_secret: "{{ (mash_playbook_generic_secret_key + ':secret.imoney') | hash('sha512') | to_uuid }}"
