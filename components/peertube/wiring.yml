---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
peertube_enabled: false

peertube_identifier: "{{ mash_playbook_service_identifier_prefix }}peertube"

peertube_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}peertube"

peertube_uid: "{{ mash_playbook_uid }}"
peertube_gid: "{{ mash_playbook_gid }}"

peertube_systemd_required_services_list_auto: |
  {{
    ([postgres_identifier ~ '.service'] if postgres_enabled and (peertube_database_hostname == postgres_connection_hostname or peertube_database_socket_enabled) else [])
  }}

peertube_systemd_wanted_services_list_auto: |
  {{
    ([exim_relay_identifier ~ '.service'] if exim_relay_enabled | default(false) and peertube_config_smtp_hostname == exim_relay_identifier else [])
  }}

peertube_container_additional_networks_auto: |
  {{
    (
      ([exim_relay_container_network] if exim_relay_enabled | default(false) and peertube_config_smtp_hostname == exim_relay_identifier and peertube_container_network != exim_relay_container_network else [])
      +
      ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
      +
      ([postgres_container_network] if postgres_enabled and (peertube_database_hostname == postgres_connection_hostname and peertube_container_network != postgres_container_network and not peertube_database_socket_enabled) else [])
    ) | unique
  }}

peertube_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
peertube_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"

peertube_container_labels_traefik_metrics_enabled: "{{ peertube_environment_variable_open_telemetry_metrics_enabled and mash_playbook_metrics_exposure_enabled }}"
peertube_container_labels_traefik_metrics_hostname: "{{ mash_playbook_metrics_exposure_hostname }}"
peertube_container_labels_traefik_metrics_path_prefix: "{{ mash_playbook_metrics_exposure_path_prefix }}/{{ peertube_identifier }}"
peertube_container_labels_traefik_metrics_middleware_basic_auth_enabled: "{{ mash_playbook_metrics_exposure_http_basic_auth_enabled }}"
peertube_container_labels_traefik_metrics_middleware_basic_auth_users: "{{ mash_playbook_metrics_exposure_http_basic_auth_users }}"

peertube_environment_variable_open_telemetry_metrics_enabled: "{{ mash_playbook_metrics_exposure_enabled }}"
