---

peertube_database_hostname: "{{ postgres_connection_hostname if postgres_enabled and not peertube_database_socket_enabled else '' }}"
peertube_database_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
peertube_database_password: "{{ (mash_playbook_generic_secret_key + ':db.peertube') | hash('sha512') | to_uuid }}"
peertube_database_socket_path_host: "{{ postgres_run_path }}"
