---

activation_prefix: writefreely_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ writefreely_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ writefreely_restart_necessary | bool }}"
        groups: [mash, writefreely]
        when: "{{ writefreely_enabled }}"
  hubsite:
    services:
      - name: "{{ mash_playbook_hubsite_service_writefreely_name }}"
        url: "{{ mash_playbook_hubsite_service_writefreely_url }}"
        logo_location: "{{ mash_playbook_hubsite_service_writefreely_logo_location }}"
        description: "{{ mash_playbook_hubsite_service_writefreely_description }}"
        priority: "{{ mash_playbook_hubsite_service_writefreely_priority }}"
        when: "{{ mash_playbook_hubsite_service_writefreely_enabled }}"
  mariadb:
    managed_databases:
      - name: "{{ writefreely_database_name }}"
        username: "{{ writefreely_database_username }}"
        password: "{{ writefreely_database_password }}"
        when: "{{ writefreely_enabled and writefreely_database_hostname == mariadb_connection_hostname and writefreely_database_type == 'mysql' }}"
