---

activation_prefix: cap_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ cap_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ cap_restart_necessary | bool }}"
        groups: [mash, cap]
        when: "{{ cap_enabled }}"
