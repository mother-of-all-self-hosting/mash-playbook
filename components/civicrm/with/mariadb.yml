---

civicrm_database_hostname: "{{ mariadb_connection_hostname if mariadb_enabled else '' }}"
civicrm_database_port: "{{ mariadb_connection_port if mariadb_enabled else '3306' }}"
civicrm_database_password: "{{ (mash_playbook_generic_secret_key + ':civicrm.db') | hash('sha512') | to_uuid }}"
