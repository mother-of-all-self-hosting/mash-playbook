---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
ghostfolio_enabled: false

ghostfolio_identifier: "{{ mash_playbook_service_identifier_prefix }}ghostfolio"

ghostfolio_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}ghostfolio"

# The role is based on Node.js docker image, and is expected to run with uid 1000.
#
# See: https://github.com/nodejs/docker-node/blob/main/docs/BestPractices.md#non-root-user
# and https://github.com/ghostfolio/ghostfolio/blob/main/Dockerfile
ghostfolio_uid: 1000
ghostfolio_gid: 1000

ghostfolio_systemd_required_services_list_auto: |
  {{
    ([postgres_identifier ~ '.service'] if postgres_enabled and (ghostfolio_database_hostname == postgres_connection_hostname or ghostfolio_database_socket_enabled) else [])
  }}

ghostfolio_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgres_container_network] if postgres_enabled and (ghostfolio_database_hostname == postgres_connection_hostname and ghostfolio_container_network != postgres_container_network and not ghostfolio_database_socket_enabled) else [])
  }}

ghostfolio_environment_variable_access_token_salt: "{{ (mash_playbook_generic_secret_key + ':at.ghostfolio') | hash('sha512') | to_uuid }}"
ghostfolio_environment_variable_jwt_secret_key: "{{ (mash_playbook_generic_secret_key + ':jsk.ghostfolio') | hash('sha512') | to_uuid }}"

ghostfolio_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
ghostfolio_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
