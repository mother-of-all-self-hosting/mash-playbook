---

activation_prefix: audiobookshelf_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ audiobookshelf_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ audiobookshelf_restart_necessary | bool }}"
        groups: [mash, audiobookshelf]
        when: "{{ audiobookshelf_enabled }}"
