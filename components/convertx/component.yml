---

activation_prefix: convertx_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ convertx_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ convertx_restart_necessary | bool }}"
        groups: [mash, convertx]
        when: "{{ convertx_enabled }}"
