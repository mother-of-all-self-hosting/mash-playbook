---

description: An SSH terminal over HTTP/HTTPS
docs:
  name: Wetty
  url: https://github.com/butlerx/wetty
  section: foss
activation_prefix: wetty_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ wetty_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ wetty_restart_necessary | bool }}"
        groups: [mash, wetty]
        when: "{{ wetty_enabled }}"
