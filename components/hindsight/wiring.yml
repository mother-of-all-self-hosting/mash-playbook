---

hindsight_enabled: false

hindsight_identifier: "{{ mash_playbook_service_identifier_prefix }}hindsight"

hindsight_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}hindsight"

hindsight_uid: "{{ mash_playbook_uid }}"
hindsight_gid: "{{ mash_playbook_gid }}"

# The role does not run a PostgreSQL instance. Point this at an external one
# (PostgreSQL 14+ with a vector extension). See `README.md`.
hindsight_api_database_url: ""

hindsight_api_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

hindsight_controlplane_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

hindsight_controlplane_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
hindsight_controlplane_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
