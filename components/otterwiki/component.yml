---

activation_prefix: otterwiki_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ otterwiki_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ otterwiki_restart_necessary | bool }}"
        groups: [mash, otterwiki]
        when: "{{ otterwiki_enabled }}"
