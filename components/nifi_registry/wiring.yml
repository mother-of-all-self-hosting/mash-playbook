---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
nifi_registry_enabled: false

nifi_registry_identifier: "{{ mash_playbook_service_identifier_prefix }}nifi-registry"

nifi_registry_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}nifi-registry"

nifi_registry_uid: "{{ mash_playbook_uid }}"
nifi_registry_gid: "{{ mash_playbook_gid }}"

nifi_registry_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

nifi_registry_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
nifi_registry_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
