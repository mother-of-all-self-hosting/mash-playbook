---

activation_prefix: cyberchef_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ cyberchef_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ cyberchef_restart_necessary | bool }}"
        groups: [mash, cyberchef]
        when: "{{ cyberchef_enabled }}"
