---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
lidarr_enabled: false

lidarr_identifier: "{{ mash_playbook_service_identifier_prefix }}lidarr"

lidarr_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}lidarr"

lidarr_uid: "{{ mash_playbook_uid }}"
lidarr_gid: "{{ mash_playbook_gid }}"

lidarr_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

lidarr_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
lidarr_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
