---

description: Music collection manager for Usenet and BitTorrent users
docs:
  name: Lidarr
  url: https://lidarr.audio/
  section: foss
activation_prefix: lidarr_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ lidarr_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ lidarr_restart_necessary | bool }}"
        groups: [mash, lidarr]
        when: "{{ lidarr_enabled }}"
