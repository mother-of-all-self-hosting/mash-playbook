---

activation_prefix: authentik_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ authentik_server_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ authentik_restart_necessary | bool }}"
        groups: [mash, authentik]
        when: "{{ authentik_enabled }}"
      - name: "{{ authentik_worker_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ authentik_restart_necessary | bool }}"
        groups: [mash, authentik]
        when: "{{ authentik_enabled }}"
  hubsite:
    services:
      - name: "{{ hubsite_service_authentik_name }}"
        url: "{{ hubsite_service_authentik_url }}"
        logo_location: "{{ hubsite_service_authentik_logo_location }}"
        description: "{{ hubsite_service_authentik_description }}"
        priority: "{{ hubsite_service_adguard_home_priority }}"
        when: "{{ hubsite_service_authentik_enabled }}"
  postgres:
    managed_databases:
      - name: "{{ authentik_database_name }}"
        username: "{{ authentik_database_username }}"
        password: "{{ authentik_database_password }}"
        when: "{{ authentik_enabled and authentik_database_hostname == postgres_connection_hostname }}"
