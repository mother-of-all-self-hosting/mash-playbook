---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
papra_enabled: false

papra_identifier: "{{ mash_playbook_service_identifier_prefix }}papra"

papra_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}papra"

papra_uid: "{{ mash_playbook_uid }}"
papra_gid: "{{ mash_playbook_gid }}"

papra_systemd_wanted_services_list_auto: |
  {{
    ([exim_relay_identifier ~ '.service'] if exim_relay_enabled | default(false) and papra_environment_variables_smtp_host == exim_relay_identifier else [])
  }}

papra_container_additional_networks_auto: |
  {{
    ([exim_relay_container_network] if exim_relay_enabled | default(false) and papra_environment_variables_smtp_host == exim_relay_identifier and papra_container_network != exim_relay_container_network else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

papra_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
papra_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
