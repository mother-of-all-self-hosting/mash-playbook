---

papra_environment_variables_emails_driver: "{{ 'smtp' if exim_relay_enabled }}"
papra_environment_variables_smtp_host: "{{ exim_relay_identifier if exim_relay_enabled else '' }}"
papra_environment_variables_smtp_port: "{{ '8025' if exim_relay_enabled else '587' }}"
papra_environment_variables_smtp_secure: "{{ false if exim_relay_enabled else true }}"
papra_environment_variables_emails_from_address: "Papra <{{ exim_relay_sender_address if exim_relay_enabled else '' }}>"
