---

activation_prefix: ntfy_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ ntfy_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ ntfy_restart_necessary | bool }}"
        groups: [mash, ntfy]
        when: "{{ ntfy_enabled }}"
  hubsite:
    services:
      - name: "{{ mash_playbook_hubsite_service_ntfy_name }}"
        url: "{{ mash_playbook_hubsite_service_ntfy_url }}"
        logo_location: "{{ mash_playbook_hubsite_service_ntfy_logo_location }}"
        description: "{{ mash_playbook_hubsite_service_ntfy_description }}"
        priority: "{{ mash_playbook_hubsite_service_ntfy_priority }}"
        when: "{{ mash_playbook_hubsite_service_ntfy_enabled }}"
  postgres:
    managed_databases:
      - name: "{{ ntfy_database_name }}"
        username: "{{ ntfy_database_username }}"
        password: "{{ ntfy_database_password }}"
        when: "{{ ntfy_enabled and ntfy_database_hostname == postgres_connection_hostname and ntfy_database_type == 'postgres' }}"
