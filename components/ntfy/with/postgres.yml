---

ntfy_database_hostname: "{{ postgres_connection_hostname if postgres_enabled else '' }}"
ntfy_database_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
ntfy_database_password: "{{ (mash_playbook_generic_secret_key + ':db.ntfy') | hash('sha512') | to_uuid }}"
ntfy_database_sslmode: "{{ 'disable' if postgres_enabled and ntfy_database_hostname == postgres_connection_hostname else 'prefer' }}"
