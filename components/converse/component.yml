---

activation_prefix: converse_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ converse_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ converse_restart_necessary | bool }}"
        groups: [mash, converse]
        when: "{{ converse_enabled }}"
