---

matomo_database_hostname: "{{ mariadb_connection_hostname if mariadb_enabled else '' }}"
matomo_database_port: "{{ mariadb_connection_port if mariadb_enabled else '3306' }}"
matomo_database_password: "{{ (mash_playbook_generic_secret_key + ':db.matomo') | hash('sha512') | to_uuid }}"
matomo_database_socket_path_host: "{{ mariadb_run_path }}"
