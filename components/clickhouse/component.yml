---

description: Column-oriented database for real-time analytical reports
docs:
  name: ClickHouse
  url: https://clickhouse.com/
  section: foss
activation_prefix: clickhouse_

# Lists other components can add entries to (via `inject`).
# The generator puts the entries of the components in use (whose `when` is true) into the `into` variable.
accepts:
  managed_databases:
    description: Databases (and users) to create and keep up to date
    into: clickhouse_managed_databases_auto
    required_keys: [additional_sql, name, password, username]

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ clickhouse_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ clickhouse_restart_necessary | bool }}"
        groups: [mash, clickhouse]
        when: "{{ clickhouse_enabled }}"
