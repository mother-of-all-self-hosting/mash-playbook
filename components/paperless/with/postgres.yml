---

paperless_database_postgres_hostname: "{{ postgres_connection_hostname if postgres_enabled and not paperless_database_postgres_socket_enabled else '' }}"
paperless_database_postgres_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
paperless_database_postgres_password: "{{ (mash_playbook_generic_secret_key + ':db.paperless') | hash('sha512') | to_uuid }}"
paperless_database_postgres_sslmode: "{{ 'disable' if postgres_enabled and (paperless_database_postgres_hostname == postgres_connection_hostname or paperless_database_postgres_socket_enabled) else 'prefer' }}"
paperless_database_postgres_socket_path_host: "{{ postgres_run_path }}"
