---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
keyoxide_enabled: false

keyoxide_proxy_enabled: false

keyoxide_identifier: "{{ mash_playbook_service_identifier_prefix }}keyoxide"

keyoxide_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}keyoxide"

keyoxide_uid: "{{ mash_playbook_uid }}"
keyoxide_gid: "{{ mash_playbook_gid }}"

keyoxide_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

keyoxide_proxy_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

keyoxide_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
keyoxide_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
