---

activation_prefix: loki_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ loki_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ loki_restart_necessary | bool }}"
        groups: [mash, loki]
        when: "{{ loki_enabled }}"
