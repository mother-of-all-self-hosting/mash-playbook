---

nextcloud_database_postgres_hostname: "{{ postgres_connection_hostname if postgres_enabled and not nextcloud_database_postgres_socket_enabled else '' }}"
nextcloud_database_postgres_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
nextcloud_database_postgres_password: "{{ (mash_playbook_generic_secret_key + ':db.nextcloud') | hash('sha512') | to_uuid }}"
nextcloud_database_postgres_socket_path_host: "{{ postgres_run_path }}"
