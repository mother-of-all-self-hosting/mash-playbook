---

nextcloud_database_mysql_hostname: "{{ mariadb_connection_hostname if mariadb_enabled and not nextcloud_database_mysql_socket_enabled else '' }}"
nextcloud_database_mysql_port: "{{ mariadb_connection_port if mariadb_enabled else '3306' }}"
nextcloud_database_mysql_password: "{{ (mash_playbook_generic_secret_key + ':db.nextcloud') | hash('sha512') | to_uuid }}"
nextcloud_database_mysql_socket_path_host: "{{ mariadb_run_path }}"
