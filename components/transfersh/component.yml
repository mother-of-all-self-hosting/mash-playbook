---

activation_prefix: transfersh_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ transfersh_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ transfersh_restart_necessary | bool }}"
        groups: [mash, transfersh]
        when: "{{ transfersh_enabled }}"
