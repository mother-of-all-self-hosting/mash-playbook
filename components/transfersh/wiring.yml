---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
transfersh_enabled: false

transfersh_identifier: "{{ mash_playbook_service_identifier_prefix }}transfersh"

transfersh_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}transfersh"

transfersh_uid: 5000 # Fixed value: https://github.com/dutchcoders/transfer.sh/blob/main/README.md#no-root
transfersh_gid: 5000 # Fixed value: https://github.com/dutchcoders/transfer.sh/blob/main/README.md#no-root

transfersh_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

transfersh_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
transfersh_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
