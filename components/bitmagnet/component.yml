---

activation_prefix: bitmagnet_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ bitmagnet_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ bitmagnet_restart_necessary | bool }}"
        groups: [mash, bitmagnet]
        when: "{{ bitmagnet_enabled }}"
  postgres:
    managed_databases:
      - name: "{{ bitmagnet_database_name }}"
        username: "{{ bitmagnet_database_username }}"
        password: "{{ bitmagnet_database_password }}"
        when: "{{ bitmagnet_enabled and (bitmagnet_database_hostname == postgres_connection_hostname or bitmagnet_database_socket_enabled) }}"
  traefik:
    entrypoints:
      - name: "{{ bitmagnet_container_labels_traefik_tcp_entrypoints }}"
        port: "{{ bitmagnet_container_tcp_port }}"
        host_bind_port: "{{ bitmagnet_container_tcp_host_bind_port }}"
        config:
          transport:
            respondingTimeouts:
              readTimeout: "{{ traefik_config_entrypoint_web_transport_respondingTimeouts_readTimeout }}"
              writeTimeout: "{{ traefik_config_entrypoint_web_transport_respondingTimeouts_writeTimeout }}"
              idleTimeout: "{{ traefik_config_entrypoint_web_transport_respondingTimeouts_idleTimeout }}"
        when: "{{ bitmagnet_enabled and bitmagnet_container_labels_traefik_tcp_enabled }}"
      - name: "{{ bitmagnet_container_labels_traefik_udp_entrypoints }}"
        port: "{{ bitmagnet_container_udp_port | string + '/udp' }}"
        host_bind_port: "{{ bitmagnet_container_udp_host_bind_port }}"
        config: {}
        when: "{{ bitmagnet_enabled and bitmagnet_container_labels_traefik_udp_enabled }}"
