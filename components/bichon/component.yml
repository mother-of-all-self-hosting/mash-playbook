---

description: Email archiving server with full-text search function
docs:
  name: Bichon
  url: https://github.com/rustmailer/bichon
  section: foss
activation_prefix: bichon_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ bichon_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ bichon_restart_necessary | bool }}"
        groups: [mash, bichon]
        when: "{{ bichon_enabled }}"
