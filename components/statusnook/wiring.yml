---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
statusnook_enabled: false

statusnook_identifier: "{{ mash_playbook_service_identifier_prefix }}statusnook"

statusnook_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}statusnook"

statusnook_uid: "{{ mash_playbook_uid }}"
statusnook_gid: "{{ mash_playbook_gid }}"

statusnook_systemd_wanted_services_list_auto: |
  {{
    ([exim_relay_identifier ~ '.service'] if exim_relay_enabled | default(false) else [])
  }}

statusnook_container_additional_networks_auto: |
  {{
    ([exim_relay_container_network] if exim_relay_enabled | default(false) and statusnook_container_network != exim_relay_container_network else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

statusnook_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
statusnook_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
