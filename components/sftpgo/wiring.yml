---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
sftpgo_enabled: false

sftpgo_identifier: "{{ mash_playbook_service_identifier_prefix }}sftpgo"

sftpgo_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}sftpgo"

sftpgo_uid: "{{ mash_playbook_uid }}"
sftpgo_gid: "{{ mash_playbook_gid }}"

sftpgo_systemd_required_services_list_auto: |
  {{
    ([mariadb_identifier ~ '.service'] if mariadb_enabled | default(false) and (sftpgo_database_mysql_hostname == mariadb_connection_hostname or sftpgo_database_mysql_socket_enabled) and sftpgo_environment_variables_data_provider_driver == 'mysql' else [])
    +
    ([postgres_identifier ~ '.service'] if postgres_enabled | default(false) and (sftpgo_database_postgres_hostname == postgres_connection_hostname or sftpgo_database_postgres_socket_enabled) and sftpgo_environment_variables_data_provider_driver == 'postgres' else [])
    +
    ([traefik_certs_dumper_identifier + '-wait-for-domain@' + sftpgo_hostname + '.service'] if traefik_enabled and traefik_certs_dumper_enabled | default(false) else [])
  }}

sftpgo_systemd_wanted_services_list_auto: |
  {{
    ([exim_relay_identifier ~ '.service'] if exim_relay_enabled | default(false) and sftpgo_mailer_smtp_enabled | default(false) and sftpgo_environment_variables_smtp_host == exim_relay_identifier else [])
  }}

sftpgo_container_additional_networks_auto: |
  {{
    ([exim_relay_container_network] if exim_relay_enabled | default(false) and sftpgo_mailer_smtp_enabled | default(false) and sftpgo_environment_variables_smtp_host == exim_relay_identifier and sftpgo_container_network != exim_relay_container_network else [])
    +
    ([mariadb_container_network] if mariadb_enabled | default(false) and (sftpgo_database_mysql_hostname == mariadb_connection_hostname and sftpgo_container_network != mariadb_container_network and not sftpgo_database_mysql_socket_enabled) and sftpgo_environment_variables_data_provider_driver == 'mysql' else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgres_container_network] if postgres_enabled | default(false) and (sftpgo_database_postgres_hostname == postgres_connection_hostname and sftpgo_container_network != postgres_container_network and not sftpgo_database_postgres_socket_enabled) and sftpgo_environment_variables_data_provider_driver == 'postgres' else [])
  }}

sftpgo_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
sftpgo_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"

sftpgo_container_labels_traefik_metrics_enabled: "{{ sftpgo_metrics_enabled and mash_playbook_metrics_exposure_enabled }}"
sftpgo_container_labels_traefik_metrics_hostname: "{{ mash_playbook_metrics_exposure_hostname }}"
sftpgo_container_labels_traefik_metrics_path_prefix: "{{ mash_playbook_metrics_exposure_path_prefix }}/{{ sftpgo_identifier }}"
sftpgo_container_labels_traefik_metrics_middleware_basic_auth_enabled: "{{ mash_playbook_metrics_exposure_http_basic_auth_enabled }}"
sftpgo_container_labels_traefik_metrics_middleware_basic_auth_users: "{{ mash_playbook_metrics_exposure_http_basic_auth_users }}"

sftpgo_metrics_enabled: "{{ prometheus_enabled | default(false) or mash_playbook_metrics_exposure_enabled }}"
