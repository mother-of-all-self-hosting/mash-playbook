---

activation_prefix: browserless_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ browserless_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ browserless_restart_necessary | bool }}"
        groups: [mash, browserless]
        when: "{{ browserless_enabled }}"
