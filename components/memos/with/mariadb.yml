---

memos_database_mysql_hostname: "{{ mariadb_connection_hostname if mariadb_enabled and not memos_database_mysql_socket_enabled else '' }}"
memos_database_mysql_port: "{{ mariadb_connection_port if mariadb_enabled else '3306' }}"
memos_database_mysql_password: "{{ (mash_playbook_generic_secret_key + ':memos.db.m') | hash('sha512') | to_uuid }}"
memos_database_mysql_socket_path_host: "{{ mariadb_run_path }}"
