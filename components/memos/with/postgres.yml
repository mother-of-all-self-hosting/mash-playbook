---

memos_database_postgres_hostname: "{{ postgres_connection_hostname if postgres_enabled and not memos_database_postgres_socket_enabled else '' }}"
memos_database_postgres_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
memos_database_postgres_password: "{{ (mash_playbook_generic_secret_key + ':memos.db.p') | hash('sha512') | to_uuid }}"
memos_database_postgres_socket_path_host: "{{ postgres_run_path }}"
