---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
memos_enabled: false

memos_identifier: "{{ mash_playbook_service_identifier_prefix }}memos"

memos_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}memos"

memos_uid: "{{ mash_playbook_uid }}"
memos_gid: "{{ mash_playbook_gid }}"

memos_systemd_required_services_list_auto: |
  {{
    ([mariadb_identifier ~ '.service'] if mariadb_enabled | default(false) and (memos_database_mysql_hostname == mariadb_connection_hostname or memos_database_mysql_socket_enabled) and memos_database_type == 'mysql' else [])
    +
    ([postgres_identifier ~ '.service'] if postgres_enabled | default(false) and (memos_database_postgres_hostname == postgres_connection_hostname or memos_database_postgres_socket_enabled) and memos_database_type == 'postgres' else [])
  }}

memos_container_additional_networks_auto: |
  {{
    ([mariadb_container_network] if mariadb_enabled | default(false) and (memos_database_mysql_hostname == mariadb_connection_hostname and memos_container_network != mariadb_container_network and not memos_database_mysql_socket_enabled) and memos_database_type == 'mysql' else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgres_container_network] if postgres_enabled | default(false) and (memos_database_postgres_hostname == postgres_connection_hostname and memos_container_network != postgres_container_network and not memos_database_postgres_socket_enabled) and memos_database_type == 'postgres' else [])
  }}

memos_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
memos_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
