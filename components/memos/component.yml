---

activation_prefix: memos_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ memos_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ memos_restart_necessary | bool }}"
        groups: [mash, memos]
        when: "{{ memos_enabled }}"
  mariadb:
    managed_databases:
      - name: "{{ memos_database_name }}"
        username: "{{ memos_database_mysql_username }}"
        password: "{{ memos_database_mysql_password }}"
        when: "{{ memos_enabled and (memos_database_mysql_hostname == mariadb_connection_hostname or memos_database_mysql_socket_enabled) and memos_database_type == 'mysql' }}"
  postgres:
    managed_databases:
      - name: "{{ memos_database_name }}"
        username: "{{ memos_database_postgres_username }}"
        password: "{{ memos_database_postgres_password }}"
        when: "{{ memos_enabled and (memos_database_postgres_hostname == postgres_connection_hostname or memos_database_postgres_socket_enabled) and memos_database_type == 'postgres' }}"
