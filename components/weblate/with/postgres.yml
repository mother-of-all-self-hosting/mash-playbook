---

weblate_database_hostname: "{{ postgres_connection_hostname if postgres_enabled and not weblate_database_socket_enabled else '' }}"
weblate_database_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
weblate_database_password: "{{ (mash_playbook_generic_secret_key + ':weblate.db') | hash('sha512') | to_uuid }}"
weblate_database_sslmode: "{{ 'disable' if postgres_enabled and (weblate_database_hostname == postgres_connection_hostname or weblate_database_socket_enabled) else 'prefer' }}"
weblate_database_socket_path_host: "{{ postgres_run_path }}"
