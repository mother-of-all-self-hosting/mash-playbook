---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
outline_enabled: false

outline_identifier: "{{ mash_playbook_service_identifier_prefix }}outline"

outline_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}outline"

outline_uid: "{{ mash_playbook_uid }}"
outline_gid: "{{ mash_playbook_gid }}"

outline_systemd_required_services_list_auto: |
  {{
    ([postgres_identifier ~ '.service'] if postgres_enabled and (outline_database_hostname == postgres_connection_hostname or outline_database_socket_enabled) else [])
  }}

outline_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgres_container_network] if postgres_enabled and (outline_database_hostname == postgres_connection_hostname and outline_container_network != postgres_container_network and not outline_database_socket_enabled) else [])
  }}

outline_environment_variable_utils_secret: "{{ (mash_playbook_generic_secret_key + ':utils.out') | hash('sha512') | to_uuid }}"

outline_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
outline_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
