---

outline_database_hostname: "{{ postgres_connection_hostname if postgres_enabled and not outline_database_socket_enabled else '' }}"
outline_database_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
outline_database_password: "{{ (mash_playbook_generic_secret_key + ':db.out') | hash('sha512') | to_uuid }}"
outline_database_sslmode: "{{ 'disable' if postgres_enabled and (outline_database_hostname == postgres_connection_hostname or outline_database_socket_enabled) else 'prefer' }}"
outline_database_socket_path_host: "{{ postgres_run_path }}"
