---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
mermaid_enabled: false

mermaid_identifier: "{{ mash_playbook_service_identifier_prefix }}mermaid"

mermaid_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}mermaid"

mermaid_uid: "{{ mash_playbook_uid }}"
mermaid_gid: "{{ mash_playbook_gid }}"

mermaid_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

mermaid_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
mermaid_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
