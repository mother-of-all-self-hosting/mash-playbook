---

activation_prefix: mermaid_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ mermaid_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ mermaid_restart_necessary | bool }}"
        groups: [mash, mermaid]
        when: "{{ mermaid_enabled }}"
