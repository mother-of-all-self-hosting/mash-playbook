---

listmonk_database_hostname: "{{ postgres_connection_hostname if postgres_enabled and not listmonk_database_socket_enabled else '' }}"
listmonk_database_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
listmonk_database_username: "{{ listmonk_identifier }}"
listmonk_database_password: "{{ (mash_playbook_generic_secret_key + ':db.listmonk') | hash('sha512') | to_uuid }}"
listmonk_database_sslmode: "{{ 'disable' if postgres_enabled and (listmonk_database_hostname == postgres_connection_hostname or listmonk_database_socket_enabled) else 'prefer' }}"
listmonk_database_socket_path_host: "{{ postgres_run_path }}"
