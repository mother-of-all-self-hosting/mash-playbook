---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
listmonk_enabled: false

listmonk_identifier: "{{ mash_playbook_service_identifier_prefix }}listmonk"

listmonk_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}listmonk"

# Run as root
listmonk_uid: "0"
listmonk_gid: "0"

listmonk_systemd_required_services_list_auto: |
  {{
    ([postgres_identifier ~ '.service'] if postgres_enabled and (listmonk_database_hostname == postgres_connection_hostname or listmonk_database_socket_enabled) else [])
  }}

listmonk_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgres_container_network] if postgres_enabled and (listmonk_database_hostname == postgres_connection_hostname and listmonk_container_network != postgres_container_network and not listmonk_database_socket_enabled) else [])
  }}

listmonk_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
listmonk_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
