---

description: Agent which ships local logs to a Grafana Loki instance
docs:
  name: Promtail
  url: https://grafana.com/docs/loki/latest/send-data/promtail/
  section: foss
activation_prefix: promtail_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ promtail_identifier }}.service"
        priority: 500
        restart_necessary: "{{ promtail_restart_necessary | bool }}"
        groups: [mash, logs, promtail]
        when: "{{ promtail_enabled }}"
