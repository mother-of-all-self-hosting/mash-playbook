---

donetick_database_hostname: "{{ postgres_connection_hostname if postgres_enabled else '' }}"
donetick_database_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
donetick_database_username: "{{ donetick_identifier }}"
donetick_database_password: "{{ (mash_playbook_generic_secret_key + ':db.donetick') | hash('sha512') | to_uuid }}"
