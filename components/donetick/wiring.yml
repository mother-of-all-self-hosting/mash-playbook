---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
donetick_enabled: false

donetick_identifier: "{{ mash_playbook_service_identifier_prefix }}donetick"

donetick_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}donetick"

donetick_uid: "{{ mash_playbook_uid }}"
donetick_gid: "{{ mash_playbook_gid }}"

donetick_systemd_required_services_list_auto: |
  {{
    ([postgres_identifier ~ '.service'] if postgres_enabled and donetick_database_hostname == postgres_connection_hostname and donetick_database_type == 'postgres' else [])
  }}

donetick_systemd_wanted_services_list_auto: |
  {{
    ([exim_relay_identifier ~ '.service'] if exim_relay_enabled | default(false) and donetick_config_email_host == exim_relay_identifier else [])
  }}

donetick_container_additional_networks_auto: |
  {{
    ([exim_relay_container_network] if exim_relay_enabled | default(false) and donetick_config_email_host == exim_relay_identifier and donetick_container_network != exim_relay_container_network else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgres_container_network] if postgres_enabled and donetick_database_hostname == postgres_connection_hostname and donetick_container_network != postgres_container_network and donetick_database_type == 'postgres' else [])
  }}

donetick_config_jwt_secret: "{{ (mash_playbook_generic_secret_key + ':jwt.donetick') | hash('sha512') | to_uuid }}"

donetick_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
donetick_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
