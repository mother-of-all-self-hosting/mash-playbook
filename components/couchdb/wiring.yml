---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
couchdb_enabled: false

couchdb_identifier: "{{ mash_playbook_service_identifier_prefix }}couchdb"

couchdb_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}couchdb"

couchdb_uid: "{{ mash_playbook_uid }}"
couchdb_gid: "{{ mash_playbook_gid }}"

couchdb_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

couchdb_config_couch_chttpd_auth_secret: "{{ (mash_playbook_generic_secret_key + ':secret.couchdb') | hash('sha512') | to_uuid }}"

# Only enable Traefik labels if a hostname is set (indicating that this will be exposed publicly)
couchdb_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled and couchdb_hostname | length > 0 }}"
couchdb_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
