---

description: Privacy-friendly Google Fonts proxy
docs:
  name: PoodleDonts
  url: https://git.private.coffee/PrivateCoffee/poodledonts
  section: foss
activation_prefix: poodledonts_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ poodledonts_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ poodledonts_restart_necessary | bool }}"
        groups: [mash, poodledonts]
        when: "{{ poodledonts_enabled }}"
