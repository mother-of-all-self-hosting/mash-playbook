# PrivateBin
mash_playbook_hubsite_service_privatebin_enabled: "{{ privatebin_enabled }}"
mash_playbook_hubsite_service_privatebin_name: PrivateBin
mash_playbook_hubsite_service_privatebin_url: "{{ privatebin_scheme }}://{{ privatebin_hostname }}{{ privatebin_path_prefix }}"
