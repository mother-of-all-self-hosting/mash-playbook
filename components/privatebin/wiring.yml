---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
privatebin_enabled: false

privatebin_identifier: "{{ mash_playbook_service_identifier_prefix }}privatebin"

privatebin_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}privatebin"

privatebin_uid: "{{ mash_playbook_uid }}"
privatebin_gid: "{{ mash_playbook_gid }}"

privatebin_systemd_required_services_list_auto: |
  {{
    ([mariadb_identifier ~ '.service'] if mariadb_enabled | default(false) and (privatebin_database_mysql_hostname == mariadb_connection_hostname or privatebin_database_mysql_socket_enabled) and privatebin_config_model == 'mysql' else [])
    +
    ([postgres_identifier ~ '.service'] if postgres_enabled | default(false) and (privatebin_database_postgres_hostname == postgres_connection_hostname or privatebin_database_postgres_socket_enabled) and privatebin_config_model == 'postgres' else [])
  }}

privatebin_container_additional_networks_auto: |
  {{
    ([mariadb_container_network] if mariadb_enabled | default(false) and (privatebin_database_mysql_hostname == mariadb_connection_hostname and privatebin_container_network != mariadb_container_network and not privatebin_database_mysql_socket_enabled) and privatebin_config_model == 'mysql' else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgres_container_network] if postgres_enabled | default(false) and (privatebin_database_postgres_hostname == postgres_connection_hostname and privatebin_container_network != postgres_container_network and not privatebin_database_postgres_socket_enabled) and privatebin_config_model == 'postgres' else [])
  }}

privatebin_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
privatebin_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
