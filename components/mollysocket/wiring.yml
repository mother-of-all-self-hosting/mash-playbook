---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
mollysocket_enabled: false

mollysocket_identifier: "{{ mash_playbook_service_identifier_prefix }}mollysocket"

mollysocket_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}mollysocket"

mollysocket_uid: "{{ mash_playbook_uid }}"
mollysocket_gid: "{{ mash_playbook_gid }}"

mollysocket_systemd_wanted_services_list_auto: |
  {{
    ([ntfy_identifier ~ '.service'] if ntfy_enabled | default(false) else [])
  }}

mollysocket_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([ntfy_container_network] if ntfy_enabled | default(false) and mollysocket_container_network != ntfy_container_network else [])
  }}

mollysocket_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
mollysocket_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
