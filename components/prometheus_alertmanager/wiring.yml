---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
prometheus_alertmanager_enabled: false

prometheus_alertmanager_identifier: "{{ mash_playbook_service_identifier_prefix }}prometheus-alertmanager"

prometheus_alertmanager_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}prometheus-alertmanager"

prometheus_alertmanager_uid: "{{ mash_playbook_uid }}"
prometheus_alertmanager_gid: "{{ mash_playbook_gid }}"

prometheus_systemd_wanted_services_list_auto: |
  {{
    ([exim_relay_identifier ~ '.service'] if exim_relay_enabled | default(false) else [])
  }}

prometheus_alertmanager_container_additional_networks_auto: |
  {{
    ([exim_relay_container_network] if exim_relay_enabled | default(false) and prometheus_alertmanager_container_network != exim_relay_container_network else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([prometheus_container_network] if prometheus_enabled | default(false) and prometheus_alertmanager_container_network != prometheus_container_network and not prometheus_alertmanager_container_labels_traefik_metrics_enabled else [])
  }}

prometheus_alertmanager_container_labels_traefik_metrics_enabled: "{{ mash_playbook_metrics_exposure_enabled }}"
prometheus_alertmanager_container_labels_traefik_metrics_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
prometheus_alertmanager_container_labels_traefik_metrics_hostname: "{{ mash_playbook_metrics_exposure_hostname }}"
prometheus_alertmanager_container_labels_traefik_metrics_path_prefix: "{{ mash_playbook_metrics_exposure_path_prefix }}/{{ prometheus_alertmanager_identifier }}"
prometheus_alertmanager_container_labels_traefik_metrics_middleware_basic_auth_enabled: "{{ mash_playbook_metrics_exposure_http_basic_auth_enabled }}"
prometheus_alertmanager_container_labels_traefik_metrics_middleware_basic_auth_users: "{{ mash_playbook_metrics_exposure_http_basic_auth_users }}"
