---

description: Indexing daemon for the Radicle network
docs:
  name: radicle-search
  url: https://radicle.network/nodes/seed.radicle.dev/rad%3Az4V1sjrXqjvFdnCUbxPFqd5p4DtH5/tree/explorer/crates/radicle-search/README.md
  section: foss
activation_prefix: radicle_search_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ radicle_search_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ radicle_search_restart_necessary | bool }}"
        groups: [mash, radicle, radicle-search]
        when: "{{ radicle_search_enabled }}"
