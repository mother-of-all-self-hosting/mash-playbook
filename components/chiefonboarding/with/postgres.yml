---

chiefonboarding_database_hostname: "{{ postgres_connection_hostname if postgres_enabled and not chiefonboarding_database_socket_enabled else '' }}"
chiefonboarding_database_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
chiefonboarding_database_password: "{{ (mash_playbook_generic_secret_key + ':db.chiefonboarding') | hash('sha512') | to_uuid }}"
chiefonboarding_database_sslmode: "{{ 'disable' if postgres_enabled and (chiefonboarding_database_hostname == postgres_connection_hostname or chiefonboarding_database_socket_enabled) else 'prefer' }}"
chiefonboarding_database_socket_path_host: "{{ postgres_run_path }}"
