---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
chiefonboarding_enabled: false

chiefonboarding_identifier: "{{ mash_playbook_service_identifier_prefix }}chiefonboarding"

chiefonboarding_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}chiefonboarding"

# Run as root only
chiefonboarding_uid: "0"
chiefonboarding_gid: "0"

chiefonboarding_systemd_required_services_list_auto: |
  {{
    ([postgres_identifier ~ '.service'] if postgres_enabled and (chiefonboarding_database_hostname == postgres_connection_hostname or chiefonboarding_database_socket_enabled) else [])
  }}

chiefonboarding_systemd_wanted_services_list_auto: |
  {{
    ([exim_relay_identifier ~ '.service'] if exim_relay_enabled | default(false) and chiefonboarding_mailer_smtp_enabled | default(false) and chiefonboarding_environment_variables_email_host == exim_relay_identifier else [])
  }}

chiefonboarding_container_additional_networks_auto: |
  {{
    ([exim_relay_container_network] if exim_relay_enabled | default(false) and chiefonboarding_mailer_smtp_enabled | default(false) and chiefonboarding_environment_variables_email_host == exim_relay_identifier and chiefonboarding_container_network != exim_relay_container_network else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgres_container_network] if postgres_enabled and (chiefonboarding_database_hostname == postgres_connection_hostname and chiefonboarding_container_network != postgres_container_network and not chiefonboarding_database_socket_enabled) else [])
  }}

chiefonboarding_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
chiefonboarding_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
