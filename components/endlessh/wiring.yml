---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
endlessh_enabled: false

endlessh_identifier: "{{ mash_playbook_service_identifier_prefix }}endlessh"

endlessh_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}endlessh"

endlessh_uid: "{{ mash_playbook_uid }}"
endlessh_gid: "{{ mash_playbook_gid }}"

endlessh_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

endlessh_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
endlessh_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"

endlessh_container_labels_traefik_metrics_enabled: "{{ mash_playbook_metrics_exposure_enabled }}"
endlessh_container_labels_traefik_metrics_hostname: "{{ mash_playbook_metrics_exposure_hostname }}"
endlessh_container_labels_traefik_metrics_path_prefix: "{{ mash_playbook_metrics_exposure_path_prefix }}/{{ endlessh_identifier }}"
endlessh_container_labels_traefik_metrics_middleware_basic_auth_enabled: "{{ mash_playbook_metrics_exposure_http_basic_auth_enabled }}"
endlessh_container_labels_traefik_metrics_middleware_basic_auth_users: "{{ mash_playbook_metrics_exposure_http_basic_auth_users }}"
