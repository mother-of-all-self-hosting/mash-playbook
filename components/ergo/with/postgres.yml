---

ergo_database_postgres_hostname: "{{ postgres_connection_hostname if postgres_enabled and not ergo_database_postgres_socket_enabled else '' }}"
ergo_database_postgres_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
ergo_database_postgres_password: "{{ (mash_playbook_generic_secret_key + ':ergo.db.p') | hash('sha512') | to_uuid }}"
ergo_database_postgres_sslmode: "{{ 'disable' if postgres_enabled and (ergo_database_postgres_hostname == postgres_connection_hostname or ergo_database_postgres_socket_enabled) else 'require' }}"
ergo_database_postgres_socket_path_host: "{{ postgres_run_path }}"
