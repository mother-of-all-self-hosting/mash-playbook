---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
neko_enabled: false

neko_identifier: "{{ mash_playbook_service_identifier_prefix }}neko"

neko_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}neko"

neko_uid: "{{ mash_playbook_uid }}"
neko_gid: "{{ mash_playbook_gid }}"

neko_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

neko_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
neko_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"

neko_container_labels_traefik_metrics_enabled: "{{ mash_playbook_metrics_exposure_enabled }}"
neko_container_labels_traefik_metrics_hostname: "{{ mash_playbook_metrics_exposure_hostname }}"
neko_container_labels_traefik_metrics_path_prefix: "{{ mash_playbook_metrics_exposure_path_prefix }}/{{ neko_identifier }}"
neko_container_labels_traefik_metrics_middleware_basic_auth_enabled: "{{ mash_playbook_metrics_exposure_http_basic_auth_enabled }}"
neko_container_labels_traefik_metrics_middleware_basic_auth_users: "{{ mash_playbook_metrics_exposure_http_basic_auth_users }}"
