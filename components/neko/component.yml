---

activation_prefix: neko_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ neko_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ neko_restart_necessary | bool }}"
        groups: [mash, neko]
        when: "{{ neko_enabled }}"
