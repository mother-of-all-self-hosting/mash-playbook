---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
fider_enabled: false

fider_identifier: "{{ mash_playbook_service_identifier_prefix }}fider"

fider_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}fider"

fider_uid: "{{ mash_playbook_uid }}"
fider_gid: "{{ mash_playbook_gid }}"

fider_systemd_required_services_list_auto: |
  {{
    ([postgres_identifier ~ '.service'] if postgres_enabled and fider_database_hostname == postgres_connection_hostname else [])
  }}

fider_systemd_wanted_services_list_auto: |
  {{
    ([exim_relay_identifier ~ '.service'] if exim_relay_enabled | default(false) and fider_mailer_smtp_enabled | default(false) and fider_environment_variables_email_smtp_host == exim_relay_identifier else [])
  }}

fider_container_additional_networks_auto: |
  {{
    ([exim_relay_container_network] if exim_relay_enabled | default(false) and fider_mailer_smtp_enabled | default(false) and fider_environment_variables_email_smtp_host == exim_relay_identifier and fider_container_network != exim_relay_container_network else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgres_container_network] if postgres_enabled and fider_database_hostname == postgres_connection_hostname and fider_container_network != postgres_container_network else [])
  }}

fider_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
fider_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"

fider_container_labels_traefik_metrics_enabled: "{{ fider_environment_variables_metrics_enabled and mash_playbook_metrics_exposure_enabled }}"
fider_container_labels_traefik_metrics_hostname: "{{ mash_playbook_metrics_exposure_hostname }}"
fider_container_labels_traefik_metrics_path_prefix: "{{ mash_playbook_metrics_exposure_path_prefix }}/{{ fider_identifier }}"
fider_container_labels_traefik_metrics_middleware_basic_auth_enabled: "{{ mash_playbook_metrics_exposure_http_basic_auth_enabled }}"
fider_container_labels_traefik_metrics_middleware_basic_auth_users: "{{ mash_playbook_metrics_exposure_http_basic_auth_users }}"

fider_environment_variables_metrics_enabled: "{{ prometheus_enabled | default(false) or mash_playbook_metrics_exposure_enabled }}"

fider_environment_variables_jwt_secret: "{{ (mash_playbook_generic_secret_key + ':s.fider') | hash('sha512') | to_uuid }}"
