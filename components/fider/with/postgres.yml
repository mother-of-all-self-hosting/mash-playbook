---

fider_database_hostname: "{{ postgres_connection_hostname if postgres_enabled else '' }}"
fider_database_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
fider_database_password: "{{ (mash_playbook_generic_secret_key + ':db.fider') | hash('sha512') | to_uuid }}"
fider_database_sslmode: "{{ 'disable' if postgres_enabled and fider_database_hostname == postgres_connection_hostname else 'prefer' }}"
