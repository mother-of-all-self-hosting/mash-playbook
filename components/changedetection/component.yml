---

activation_prefix: changedetection_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ changedetection_identifier }}.service"
        priority: 2100
        restart_necessary: "{{ changedetection_restart_necessary | bool }}"
        groups: [mash, changedetection]
        when: "{{ changedetection_enabled }}"
      - name: "{{ changedetection_playwright_driver_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ changedetection_restart_necessary | bool }}"
        groups: [mash, changedetection]
        when: "{{ changedetection_playwright_driver_enabled }}"
