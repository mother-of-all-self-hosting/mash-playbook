---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
polaris_enabled: false

polaris_identifier: "{{ mash_playbook_service_identifier_prefix }}polaris"

polaris_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}polaris"

polaris_uid: 100
polaris_gid: 100

polaris_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

polaris_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
polaris_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
