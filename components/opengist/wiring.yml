---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
opengist_enabled: false

opengist_identifier: "{{ mash_playbook_service_identifier_prefix }}opengist"

opengist_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}opengist"

opengist_uid: "{{ mash_playbook_uid }}"
opengist_gid: "{{ mash_playbook_gid }}"

opengist_systemd_required_services_list_auto: |
  {{
    ([mariadb_identifier ~ '.service'] if mariadb_enabled | default(false) and (opengist_database_mysql_hostname == mariadb_connection_hostname or opengist_database_mysql_socket_enabled) and opengist_database_type == 'mysql' else [])
    +
    ([postgres_identifier ~ '.service'] if postgres_enabled | default(false) and (opengist_database_postgres_hostname == postgres_connection_hostname or opengist_database_postgres_socket_enabled) and opengist_database_type == 'postgres' else [])
  }}

opengist_systemd_wanted_services_list_auto: |
  {{
    ([meilisearch_identifier ~ '.service'] if meilisearch_enabled | default(false) and opengist_environment_variables_index == 'meilisearch' else [])
  }}

opengist_container_additional_networks_auto: |
  {{
    ([mariadb_container_network] if mariadb_enabled | default(false) and (opengist_database_mysql_hostname == mariadb_connection_hostname and opengist_container_network != mariadb_container_network and not opengist_database_mysql_socket_enabled) and opengist_database_type == 'mysql' else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([meilisearch_container_network] if meilisearch_enabled | default(false) and opengist_container_network != meilisearch_container_network and opengist_environment_variables_index == 'meilisearch' else [])
    +
    ([postgres_container_network] if postgres_enabled | default(false) and (opengist_database_postgres_hostname == postgres_connection_hostname and opengist_container_network != postgres_container_network and not opengist_database_postgres_socket_enabled) and opengist_database_type == 'postgres' else [])
  }}

opengist_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
opengist_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"

opengist_container_labels_traefik_metrics_enabled: "{{ opengist_environment_variables_metrics_enabled and mash_playbook_metrics_exposure_enabled }}"
opengist_container_labels_traefik_metrics_hostname: "{{ mash_playbook_metrics_exposure_hostname }}"
opengist_container_labels_traefik_metrics_path_prefix: "{{ mash_playbook_metrics_exposure_path_prefix }}/{{ opengist_identifier }}"
opengist_container_labels_traefik_metrics_middleware_basic_auth_enabled: "{{ mash_playbook_metrics_exposure_http_basic_auth_enabled }}"
opengist_container_labels_traefik_metrics_middleware_basic_auth_users: "{{ mash_playbook_metrics_exposure_http_basic_auth_users }}"

opengist_environment_variables_metrics_enabled: "{{ prometheus_enabled | default(false) or mash_playbook_metrics_exposure_enabled }}"
