---

opengist_database_postgres_hostname: "{{ postgres_connection_hostname if postgres_enabled and not opengist_database_postgres_socket_enabled else '' }}"
opengist_database_postgres_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
opengist_database_postgres_password: "{{ (mash_playbook_generic_secret_key + ':opengist.db') | hash('sha512') | to_uuid }}"
opengist_database_postgres_sslmode: "{{ 'disable' if postgres_enabled and (opengist_database_postgres_hostname == postgres_connection_hostname or opengist_database_postgres_socket_enabled) else 'prefer' }}"
opengist_database_postgres_socket_path_host: "{{ postgres_run_path }}"
