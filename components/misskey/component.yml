---

activation_prefix: misskey_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ misskey_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ misskey_restart_necessary | bool }}"
        groups: [mash, misskey]
        when: "{{ misskey_enabled }}"
  postgres:
    managed_databases:
      - name: "{{ misskey_database_name }}"
        username: "{{ misskey_database_username }}"
        password: "{{ misskey_database_password }}"
        when: "{{ misskey_enabled and misskey_database_hostname == postgres_connection_hostname }}"
