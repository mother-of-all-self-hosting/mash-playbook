---

# Docker Registry Browser
mash_playbook_hubsite_service_docker_registry_browser_enabled: "{{ docker_registry_browser_enabled }}"
mash_playbook_hubsite_service_docker_registry_browser_name: Docker Registry Browser
mash_playbook_hubsite_service_docker_registry_browser_url: "https://{{ docker_registry_browser_hostname }}{{ docker_registry_browser_path_prefix }}"
mash_playbook_hubsite_service_docker_registry_browser_logo_location: "{{ role_path }}/assets/docker.png"
mash_playbook_hubsite_service_docker_registry_browser_description: "Browse docker images"
mash_playbook_hubsite_service_docker_registry_browser_priority: 1000
