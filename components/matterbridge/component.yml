---

activation_prefix: matterbridge_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ matterbridge_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ matterbridge_restart_necessary | bool }}"
        groups: [mash, matterbridge]
        when: "{{ matterbridge_enabled }}"
