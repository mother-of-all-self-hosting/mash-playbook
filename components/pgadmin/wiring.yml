---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
pgadmin_enabled: false

pgadmin_identifier: "{{ mash_playbook_service_identifier_prefix }}pgadmin"

pgadmin_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}pgadmin"

# pgAdmin runs as the pgadmin user (UID: 5050) in the pgadmin group (GID: 5050) in the container
# See: https://www.pgadmin.org/docs/pgadmin4/latest/container_deployment.html#mapped-files-and-directories
pgadmin_uid: 5050
pgadmin_gid: 5050

pgadmin_systemd_required_services_list_auto: |
  {{
    ([postgis_identifier ~ '.service'] if postgis_enabled | default(false) else [])
    +
    ([postgres_identifier ~ '.service'] if postgres_enabled | default(false) else [])
  }}

pgadmin_systemd_wanted_services_list_auto: |
  {{
    ([exim_relay_identifier ~ '.service'] if exim_relay_enabled | default(false) and pgadmin_environment_variables_pgadmin_config_mail_server == exim_relay_identifier else [])
  }}

pgadmin_container_additional_networks_auto: |
  {{
    ([exim_relay_container_network] if exim_relay_enabled | default(false) and pgadmin_environment_variables_pgadmin_config_mail_server == exim_relay_identifier and pgadmin_container_network != exim_relay_container_network else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgis_container_network] if postgis_enabled | default(false) and pgadmin_container_network != postgis_container_network else [])
    +
    ([postgres_container_network] if postgres_enabled | default(false) and pgadmin_container_network != postgres_container_network else [])
  }}

pgadmin_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
pgadmin_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
