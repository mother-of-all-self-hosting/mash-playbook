---

activation_prefix: adminer_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ adminer_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ adminer_restart_necessary | bool }}"
        groups: [mash, adminer]
        when: "{{ adminer_enabled }}"
