---

redmine_database_postgres_hostname: "{{ postgres_connection_hostname if postgres_enabled and not redmine_database_postgres_socket_enabled else '' }}"
redmine_database_postgres_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
redmine_database_postgres_password: "{{ (mash_playbook_generic_secret_key + ':redmine.db') | hash('sha512') | to_uuid }}"
redmine_database_postgres_socket_path_host: "{{ postgres_run_path }}"
