---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
i2p_enabled: false

i2p_identifier: "{{ mash_playbook_service_identifier_prefix }}i2p"

i2p_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}i2p"

i2p_uid: "{{ mash_playbook_uid }}"
i2p_gid: "{{ mash_playbook_gid }}"
