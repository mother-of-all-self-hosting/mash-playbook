---

activation_prefix: onion_service_tor_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ onion_service_tor_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ onion_service_tor_restart_necessary | bool }}"
        groups: [mash, onion-service-tor]
        when: "{{ onion_service_tor_enabled }}"
