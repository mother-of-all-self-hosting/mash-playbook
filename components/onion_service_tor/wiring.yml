---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
onion_service_tor_enabled: false

onion_service_tor_identifier: "{{ mash_playbook_service_identifier_prefix }}onion-service-tor"

onion_service_tor_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}onion-service-tor"

# Runs as root
onion_service_tor_uid: "0"
onion_service_tor_gid: "0"

onion_service_tor_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

onion_service_tor_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
onion_service_tor_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
