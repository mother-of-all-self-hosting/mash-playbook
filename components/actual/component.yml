---

activation_prefix: actual_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ actual_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ actual_restart_necessary | bool }}"
        groups: [mash, actual]
        when: "{{ actual_enabled }}"
