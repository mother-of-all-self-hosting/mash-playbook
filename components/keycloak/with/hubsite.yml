---

# Keycloak
mash_playbook_hubsite_service_keycloak_enabled: "{{ keycloak_enabled }}"
mash_playbook_hubsite_service_keycloak_name: Keycloak
mash_playbook_hubsite_service_keycloak_url: "{{ keycloak_scheme }}://{{ keycloak_hostname }}{{ keycloak_path_prefix }}"
mash_playbook_hubsite_service_keycloak_logo_location: "{{ role_path }}/assets/keycloak.png"
mash_playbook_hubsite_service_keycloak_description: "An open-source identity and access management solution."
mash_playbook_hubsite_service_keycloak_priority: 1000
