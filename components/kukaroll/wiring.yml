---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
kukaroll_enabled: false

kukaroll_identifier: "{{ mash_playbook_service_identifier_prefix }}kukaroll"

kukaroll_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}kukaroll"

kukaroll_uid: "{{ mash_playbook_uid }}"
kukaroll_gid: "{{ mash_playbook_gid }}"

kukaroll_receiver_container_network: "{{ mash_playbook_reverse_proxyable_services_additional_network or '' }}"

kukaroll_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"

# The service manager groups of the deploys target. Add the groups of the projects' services,
# so that `just install-service <service>` also pauses deploys while it restarts that service.
mash_playbook_kukaroll_deploys_service_manager_groups: [mash, kukaroll]

# Pause deploys only when the service manager will start the deploys target again afterwards: always, unless this run handles another group.
kukaroll_pause_enabled: "{{ group is not defined or group in mash_playbook_kukaroll_deploys_service_manager_groups }}"
