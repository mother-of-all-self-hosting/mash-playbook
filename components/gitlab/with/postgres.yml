---

gitlab_database_type: "{{ 'postgres' if postgres_enabled else 'bundled' }}"
gitlab_database_postgres_hostname: "{{ postgres_connection_hostname if postgres_enabled else '' }}"
gitlab_database_postgres_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
gitlab_database_postgres_password: "{{ (mash_playbook_generic_secret_key + ':db.gitlab') | hash('sha512') | to_uuid }}"
gitlab_database_postgres_sslmode: "{{ 'disable' if postgres_enabled and (gitlab_database_postgres_hostname == postgres_connection_hostname or gitlab_database_postgres_socket_enabled) else 'require' }}"
gitlab_database_postgres_socket_path_host: "{{ postgres_run_path }}"
