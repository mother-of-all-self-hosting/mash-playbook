---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
cinny_enabled: false

cinny_identifier: "{{ mash_playbook_service_identifier_prefix }}cinny"

cinny_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}cinny"

cinny_uid: "{{ mash_playbook_uid }}"
cinny_gid: "{{ mash_playbook_gid }}"

cinny_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

cinny_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
cinny_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
