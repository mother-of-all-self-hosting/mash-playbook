---

activation_prefix: cinny_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ cinny_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ cinny_restart_necessary | bool }}"
        groups: [mash, cinny]
        when: "{{ cinny_enabled }}"
