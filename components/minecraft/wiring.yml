---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
minecraft_enabled: false

minecraft_identifier: "{{ mash_playbook_service_identifier_prefix }}minecraft"

minecraft_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}minecraft"

minecraft_uid: "{{ mash_playbook_uid }}"
minecraft_gid: "{{ mash_playbook_gid }}"

# Web interfaces exposed by plugins running inside the Minecraft container
# (BlueMap, Dynmap, ...). Each entry gets a Traefik router pointing at the
# Minecraft container on `port`; the container is joined to the Traefik network.
minecraft_web_interfaces: []

minecraft_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network]
     if minecraft_web_interfaces | length > 0 and mash_playbook_reverse_proxyable_services_additional_network
     else [])
  }}

minecraft_container_labels_additional_labels: |
  {% if mash_playbook_traefik_labels_enabled and minecraft_web_interfaces | length > 0 %}
  traefik.enable=true
  traefik.docker.network={{ mash_playbook_reverse_proxyable_services_additional_network }}
  {% for interface in minecraft_web_interfaces %}
  traefik.http.routers.{{ minecraft_identifier }}-{{ interface.name }}.rule=Host(`{{ interface.hostname }}`)
  traefik.http.routers.{{ minecraft_identifier }}-{{ interface.name }}.service={{ minecraft_identifier }}-{{ interface.name }}
  traefik.http.routers.{{ minecraft_identifier }}-{{ interface.name }}.entrypoints={{ minecraft_web_interfaces_traefik_entrypoints }}
  traefik.http.routers.{{ minecraft_identifier }}-{{ interface.name }}.tls=true
  traefik.http.routers.{{ minecraft_identifier }}-{{ interface.name }}.tls.certResolver={{ minecraft_web_interfaces_traefik_tls_certResolver }}
  traefik.http.services.{{ minecraft_identifier }}-{{ interface.name }}.loadbalancer.server.port={{ interface.port }}
  {% endfor %}
  {% endif %}
