---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
minecraft_enabled: false

minecraft_identifier: "{{ mash_playbook_service_identifier_prefix }}minecraft"

minecraft_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}minecraft"

minecraft_uid: "{{ mash_playbook_uid }}"
minecraft_gid: "{{ mash_playbook_gid }}"

# The role renders a Traefik router for each entry in `minecraft_web_interfaces`
# (plugin web interfaces such as BlueMap and Dynmap). The Minecraft container
# only needs to join the Traefik network when there is at least one interface
# to expose.
minecraft_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
minecraft_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"

minecraft_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network]
     if minecraft_container_labels_traefik_enabled
        and (minecraft_web_interfaces | default([]) | length > 0)
        and mash_playbook_reverse_proxyable_services_additional_network
     else [])
  }}
