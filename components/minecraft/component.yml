---

activation_prefix: minecraft_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ minecraft_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ minecraft_restart_necessary | bool }}"
        groups: [mash, minecraft]
        when: "{{ minecraft_enabled }}"
