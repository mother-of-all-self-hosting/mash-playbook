---

description: Java edition server for Minecraft, a popular voxel-based sandbox game
docs:
  name: Minecraft Server
  url: https://docker-minecraft-server.readthedocs.io
  section: foss
activation_prefix: minecraft_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ minecraft_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ minecraft_restart_necessary | bool }}"
        groups: [mash, minecraft]
        when: "{{ minecraft_enabled }}"
