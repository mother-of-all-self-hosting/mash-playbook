---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
open_webui_enabled: false

open_webui_identifier: "{{ mash_playbook_service_identifier_prefix }}open-webui"

open_webui_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}open-webui"

open_webui_uid: "{{ mash_playbook_uid }}"
open_webui_gid: "{{ mash_playbook_gid }}"

open_webui_systemd_required_services_list_auto: |
  {{
    ([postgres_identifier ~ '.service'] if postgres_enabled | default(false) and (open_webui_database_hostname == postgres_connection_hostname or open_webui_database_socket_enabled) and open_webui_database_type == 'postgres' else [])
  }}

open_webui_systemd_wanted_services_list_auto: |
  {{
    ([ollama_identifier ~ '.service'] if ollama_enabled | default(false) and open_webui_environment_variables_ollama_base_url == ('http://' ~ ollama_identifier ~ ':' ~ (ollama_container_http_port | string)) else [])
  }}

open_webui_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([ollama_container_network] if ollama_enabled | default(false) and open_webui_environment_variables_ollama_base_url == ('http://' ~ ollama_identifier ~ ':' ~ (ollama_container_http_port | string)) and open_webui_container_network != ollama_container_network else [])
    +
    ([postgres_container_network] if postgres_enabled | default(false) and (open_webui_database_hostname == postgres_connection_hostname and open_webui_container_network != postgres_container_network and not open_webui_database_socket_enabled) and open_webui_database_type == 'postgres' else [])
  }}

open_webui_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
open_webui_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"

open_webui_environment_variables_webui_secret_key: "{{ (mash_playbook_generic_secret_key + ':open_webui.secret') | hash('sha512') | to_uuid }}"
