---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
snowflake_enabled: false

snowflake_identifier: "{{ mash_playbook_service_identifier_prefix }}snowflake"

snowflake_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}snowflake"

snowflake_uid: "{{ mash_playbook_uid }}"
snowflake_gid: "{{ mash_playbook_gid }}"

snowflake_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}
