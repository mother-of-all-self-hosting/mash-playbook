---

activation_prefix: snowflake_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ snowflake_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ snowflake_restart_necessary | bool }}"
        groups: [mash, snowflake]
        when: "{{ snowflake_enabled }}"
