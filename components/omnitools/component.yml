---

description: Web app offering a variety of online tools to simplify everyday tasks
docs:
  name: OmniTools
  url: https://github.com/iib0011/omni-tools
  section: foss
activation_prefix: omnitools_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ omnitools_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ omnitools_restart_necessary | bool }}"
        groups: [mash, omnitools]
        when: "{{ omnitools_enabled }}"
