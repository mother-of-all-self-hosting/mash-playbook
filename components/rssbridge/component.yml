---

description: RSS feed generator for websites that do not have one
docs:
  name: RSS-Bridge
  url: https://rss-bridge.github.io/rss-bridge/
  section: foss
activation_prefix: rssbridge_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ rssbridge_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ rssbridge_restart_necessary | bool }}"
        groups: [mash, rssbridge]
        when: "{{ rssbridge_enabled }}"
