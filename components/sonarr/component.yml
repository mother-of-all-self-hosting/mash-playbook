---

description: A smart PVR for newsgroup and BitTorrent users
docs:
  name: Sonarr
  url: https://sonarr.tv/
  section: foss
activation_prefix: sonarr_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ sonarr_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ sonarr_restart_necessary | bool }}"
        groups: [mash, sonarr]
        when: "{{ sonarr_enabled }}"
