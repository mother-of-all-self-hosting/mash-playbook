---

activation_prefix: nocdnbs_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ nocdnbs_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ nocdnbs_restart_necessary | bool }}"
        groups: [mash, nocdnbs]
        when: "{{ nocdnbs_enabled }}"
