---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
flatnotes_enabled: false

flatnotes_identifier: "{{ mash_playbook_service_identifier_prefix }}flatnotes"

flatnotes_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}flatnotes"

flatnotes_uid: "{{ mash_playbook_uid }}"
flatnotes_gid: "{{ mash_playbook_gid }}"

flatnotes_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

flatnotes_environment_variables_flatnotes_secret_key: "{{ (mash_playbook_generic_secret_key + ':s.flatnotes') | hash('sha512') | to_uuid }}"

flatnotes_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
flatnotes_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
