---

activation_prefix: flatnotes_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ flatnotes_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ flatnotes_restart_necessary | bool }}"
        groups: [mash, flatnotes]
        when: "{{ flatnotes_enabled }}"
