---

uptime_kuma_database_hostname: "{{ mariadb_connection_hostname if mariadb_enabled else '' }}"
uptime_kuma_database_port: "{{ mariadb_connection_port if mariadb_enabled else '3306' }}"
uptime_kuma_database_password: "{{ (mash_playbook_generic_secret_key + ':uptimekuma.db') | hash('sha512') | to_uuid }}"
uptime_kuma_database_socket_path_host: "{{ mariadb_run_path }}"
