---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
librebooking_enabled: false

librebooking_identifier: "{{ mash_playbook_service_identifier_prefix }}librebooking"

librebooking_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}librebooking"

librebooking_uid: "33"
librebooking_gid: "33"

librebooking_systemd_required_services_list_auto: |
  {{
    ([mariadb_identifier ~ '.service'] if mariadb_enabled and librebooking_database_hostname == mariadb_connection_hostname else [])
  }}

librebooking_container_additional_networks_auto: |
  {{
    ([mariadb_container_network] if mariadb_enabled and librebooking_database_hostname == mariadb_connection_hostname and librebooking_container_network != mariadb_container_network else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

librebooking_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
librebooking_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
