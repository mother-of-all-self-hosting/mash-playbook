---

description: Network daemon for the Radicle network
docs:
  name: Radicle node
  url: https://radicle.network/nodes/seed.radicle.dev/rad%3Az3gqcJUoA1n9HaHKufZs5FCSGazv5
  section: foss
activation_prefix: radicle_node_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ radicle_node_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ radicle_node_restart_necessary | bool }}"
        groups: [mash, radicle, radicle-node]
        when: "{{ radicle_node_enabled }}"
