---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
radicle_node_enabled: false

radicle_node_identifier: "{{ mash_playbook_service_identifier_prefix }}radicle-node"

radicle_node_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}radicle-node"

# Apparently the UID and GID are fixed
# Also see: https://radicle.network/nodes/progressiv.radicle.garden/rad%3Az26FDgNVVRUfPpLiUvUksoFPFkwdw/commits/5a095b1816ec75522d59ede8e258844763e1f1ae
radicle_node_uid: "11011"
radicle_node_gid: "11011"

radicle_node_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}
