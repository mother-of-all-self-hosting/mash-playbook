---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
fmd_server_enabled: false

fmd_server_identifier: "{{ mash_playbook_service_identifier_prefix }}findmydeviceserver"

fmd_server_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}findmydeviceserver"

# Running with mash_playbook_uid and mash_playbook_gid returns permission errors.
fmd_server_uid: 1000
fmd_server_gid: 1000

fmd_server_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

fmd_server_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
fmd_server_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"

fmd_server_container_labels_traefik_metrics_enabled: "{{ mash_playbook_metrics_exposure_enabled }}"
fmd_server_container_labels_traefik_metrics_hostname: "{{ mash_playbook_metrics_exposure_hostname }}"
fmd_server_container_labels_traefik_metrics_path_prefix: "{{ mash_playbook_metrics_exposure_path_prefix }}/{{ fmd_server_identifier }}"
fmd_server_container_labels_traefik_metrics_middleware_basic_auth_enabled: "{{ mash_playbook_metrics_exposure_http_basic_auth_enabled }}"
fmd_server_container_labels_traefik_metrics_middleware_basic_auth_users: "{{ mash_playbook_metrics_exposure_http_basic_auth_users }}"

# By default metrics are exposed on localhost
fmd_server_environment_variables_fmd_metricsaddrport: ":{{ fmd_server_container_metrics_port }}"
