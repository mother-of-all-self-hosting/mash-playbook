---

activation_prefix: excalidraw_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ excalidraw_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ excalidraw_restart_necessary | bool }}"
        groups: [mash, excalidraw]
        when: "{{ excalidraw_enabled }}"
  hubsite:
    services:
      - name: "{{ hubsite_service_excalidraw_name }}"
        url: "{{ hubsite_service_excalidraw_url }}"
        logo_location: "{{ hubsite_service_excalidraw_logo_location }}"
        description: "{{ hubsite_service_excalidraw_description }}"
        priority: "{{ hubsite_service_excalidraw_priority }}"
        when: "{{ hubsite_service_excalidraw_enabled }}"
