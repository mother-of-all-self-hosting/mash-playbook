---

activation_prefix: docmost_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ docmost_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ docmost_restart_necessary | bool }}"
        groups: [mash, docmost]
        when: "{{ docmost_enabled }}"
  hubsite:
    services:
      - name: "{{ hubsite_service_docmost_name }}"
        url: "{{ hubsite_service_docmost_url }}"
        logo_location: "{{ hubsite_service_docmost_logo_location }}"
        description: "{{ hubsite_service_docmost_description }}"
        priority: "{{ hubsite_service_docmost_priority }}"
        when: "{{ hubsite_service_docmost_enabled }}"
  postgres:
    managed_databases:
      - name: "{{ docmost_database_name }}"
        username: "{{ docmost_database_username }}"
        password: "{{ docmost_database_password }}"
        when: "{{ docmost_enabled and docmost_database_hostname == postgres_connection_hostname }}"
