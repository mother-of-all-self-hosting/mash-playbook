---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
tika_enabled: false

tika_identifier: "{{ mash_playbook_service_identifier_prefix }}tika"

tika_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}tika"

tika_uid: "{{ mash_playbook_uid }}"
tika_gid: "{{ mash_playbook_gid }}"

tika_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

# Only enable Traefik labels if a hostname is set (indicating that this will be exposed publicly)
tika_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled and tika_hostname | length > 0 }}"
tika_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
