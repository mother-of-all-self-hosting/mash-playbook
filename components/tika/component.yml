---

activation_prefix: tika_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ tika_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ tika_restart_necessary | bool }}"
        groups: [mash, tika]
        when: "{{ tika_enabled }}"
