---

description: Detects and extracts metadata and text from many file types
docs:
  name: Apache Tika Server
  url: https://github.com/apache/tika-docker
  section: foss
activation_prefix: tika_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ tika_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ tika_restart_necessary | bool }}"
        groups: [mash, tika]
        when: "{{ tika_enabled }}"
