---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
mailpit_enabled: false

mailpit_identifier: "{{ mash_playbook_service_identifier_prefix }}mailpit"

mailpit_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}mailpit"

mailpit_uid: "{{ mash_playbook_uid }}"
mailpit_gid: "{{ mash_playbook_gid }}"

mailpit_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

mailpit_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
mailpit_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"

mailpit_container_labels_traefik_metrics_enabled: "{{ mailpit_environment_variables_mp_enable_prometheus and mash_playbook_metrics_exposure_enabled }}"
mailpit_container_labels_traefik_metrics_hostname: "{{ mash_playbook_metrics_exposure_hostname }}"
mailpit_container_labels_traefik_metrics_path_prefix: "{{ mash_playbook_metrics_exposure_path_prefix }}/{{ mailpit_identifier }}"
mailpit_container_labels_traefik_metrics_middleware_basic_auth_enabled: "{{ mash_playbook_metrics_exposure_http_basic_auth_enabled }}"
mailpit_container_labels_traefik_metrics_middleware_basic_auth_users: "{{ mash_playbook_metrics_exposure_http_basic_auth_users }}"

mailpit_environment_variables_mp_enable_prometheus: "{{ prometheus_enabled | default(false) or mash_playbook_metrics_exposure_enabled }}"
