---

activation_prefix: prowlarr_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ prowlarr_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ prowlarr_restart_necessary | bool }}"
        groups: [mash, prowlarr]
        when: "{{ prowlarr_enabled }}"
