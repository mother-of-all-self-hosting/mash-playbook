---

description: Server management platform with SSH terminal
docs:
  name: Termix
  url: https://docs.termix.site/
  section: foss
activation_prefix: termix_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ termix_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ termix_restart_necessary | bool }}"
        groups: [mash, termix]
        when: "{{ termix_enabled }}"
  mariadb:
    managed_databases:
      - name: "{{ termix_database_name }}"
        username: "{{ termix_database_mysql_username }}"
        password: "{{ termix_database_mysql_password }}"
        when: "{{ termix_enabled and (termix_database_mysql_hostname == mariadb_connection_hostname or termix_database_mysql_socket_enabled) and termix_database_type == 'mysql' }}"
  postgres:
    managed_databases:
      - name: "{{ termix_database_name }}"
        username: "{{ termix_database_postgres_username }}"
        password: "{{ termix_database_postgres_password }}"
        when: "{{ termix_enabled and (termix_database_postgres_hostname == postgres_connection_hostname or termix_database_postgres_socket_enabled) and termix_database_type == 'postgres' }}"
