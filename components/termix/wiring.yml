---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
termix_enabled: false

termix_identifier: "{{ mash_playbook_service_identifier_prefix }}termix"

termix_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}termix"

# Termix runs as `node`
termix_uid: 1000
termix_gid: 1000

termix_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

termix_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
termix_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
