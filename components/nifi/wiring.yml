---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
nifi_enabled: false

nifi_identifier: "{{ mash_playbook_service_identifier_prefix }}nifi"

nifi_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}nifi"

# Currently the Apache NiFi container does not support being run as non-root user per error:
# `sed: couldn't open temporary file /opt/nifi/nifi-current/conf/sed1wX1os: Permission denied`
nifi_uid: "0"
nifi_gid: "0"

nifi_systemd_wanted_services_list_auto: |
  {{
    ([nifi_registry_identifier ~ '.service'] if nifi_registry_enabled | default(false) else [])
  }}

nifi_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([nifi_registry_container_network] if nifi_registry_enabled | default(false) and nifi_container_network != nifi_registry_container_network else [])
  }}

nifi_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
nifi_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
