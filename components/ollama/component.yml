---

description: Server for running large language models on your own hardware
docs:
  name: Ollama
  url: https://ollama.com/
  section: foss
activation_prefix: ollama_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ ollama_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ ollama_restart_necessary | bool }}"
        groups: [mash, ollama]
        when: "{{ ollama_enabled }}"
