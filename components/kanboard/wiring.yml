---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
kanboard_enabled: false

kanboard_identifier: "{{ mash_playbook_service_identifier_prefix }}kanboard"

kanboard_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}kanboard"

# Kanboard runs as root user
kanboard_uid: "0"
kanboard_gid: "0"

kanboard_systemd_required_services_list_auto: |
  {{
    ([mariadb_identifier ~ '.service'] if mariadb_enabled | default(false) and kanboard_database_mysql_hostname == mariadb_connection_hostname and kanboard_database_type == 'mysql' else [])
    +
    ([postgres_identifier ~ '.service'] if postgres_enabled | default(false) and (kanboard_database_postgres_hostname == postgres_connection_hostname or kanboard_database_postgres_socket_enabled) and kanboard_database_type == 'postgres' else [])
  }}

kanboard_systemd_wanted_services_list_auto: |
  {{
    ([exim_relay_identifier ~ '.service'] if exim_relay_enabled | default(false) and kanboard_environment_variables_mail_smtp_hostname == exim_relay_identifier else [])
  }}

kanboard_container_additional_networks_auto: |
  {{
    ([exim_relay_container_network] if exim_relay_enabled | default(false) and kanboard_environment_variables_mail_smtp_hostname == exim_relay_identifier and kanboard_container_network != exim_relay_container_network else [])
    +
    ([mariadb_container_network] if mariadb_enabled | default(false) and kanboard_database_mysql_hostname == mariadb_connection_hostname and kanboard_container_network != mariadb_container_network and kanboard_database_type == 'mysql' else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgres_container_network] if postgres_enabled | default(false) and (kanboard_database_postgres_hostname == postgres_connection_hostname and kanboard_container_network != postgres_container_network and not kanboard_database_postgres_socket_enabled) and kanboard_database_type == 'postgres' else [])
  }}

kanboard_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
kanboard_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
