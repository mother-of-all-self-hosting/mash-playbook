---

activation_prefix: jellyfin_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ jellyfin_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ jellyfin_restart_necessary | bool }}"
        groups: [mash, jellyfin]
        when: "{{ jellyfin_enabled }}"
