---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
rsshub_enabled: false

rsshub_identifier: "{{ mash_playbook_service_identifier_prefix }}rsshub"

rsshub_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}rsshub"

rsshub_uid: "{{ mash_playbook_uid }}"
rsshub_gid: "{{ mash_playbook_gid }}"

rsshub_systemd_wanted_services_list_auto: |
  {{
    ([browserless_identifier ~ '.service'] if browserless_enabled | default(false) else [])
  }}

rsshub_container_additional_networks_auto: |
  {{
    ([browserless_container_network] if browserless_enabled | default(false) and rsshub_container_network != browserless_container_network else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

rsshub_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
rsshub_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
