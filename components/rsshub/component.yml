---

activation_prefix: rsshub_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ rsshub_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ rsshub_restart_necessary | bool }}"
        groups: [mash, rsshub]
        when: "{{ rsshub_enabled }}"
