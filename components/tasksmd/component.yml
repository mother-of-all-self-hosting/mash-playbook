---

activation_prefix: tasksmd_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ tasksmd_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ tasksmd_restart_necessary | bool }}"
        groups: [mash, tasksmd]
        when: "{{ tasksmd_enabled }}"
