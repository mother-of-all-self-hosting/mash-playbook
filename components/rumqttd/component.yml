---

activation_prefix: rumqttd_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ rumqttd_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ rumqttd_restart_necessary | bool }}"
        groups: [mash, rumqttd]
        when: "{{ rumqttd_enabled }}"
