---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
yourls_enabled: false

yourls_identifier: "{{ mash_playbook_service_identifier_prefix }}yourls"

yourls_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}yourls"

yourls_uid: "{{ mash_playbook_uid }}"
yourls_gid: "{{ mash_playbook_gid }}"

yourls_systemd_required_services_list_auto: |
  {{
    ([mariadb_identifier ~ '.service'] if mariadb_enabled and (yourls_database_hostname == mariadb_connection_hostname or yourls_database_socket_enabled) else [])
  }}

yourls_container_additional_networks_auto: |
  {{
    ([mariadb_container_network] if mariadb_enabled and (yourls_database_hostname == mariadb_connection_hostname and yourls_container_network != mariadb_container_network and not yourls_database_socket_enabled) else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

yourls_environment_variable_cookiekey: "{{ (mash_playbook_generic_secret_key + ':secret.yourls') | hash('sha512') | to_uuid }}"

yourls_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
yourls_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
