---

activation_prefix: unpackerr_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ unpackerr_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ unpackerr_restart_necessary | bool }}"
        groups: [mash, unpackerr]
        when: "{{ unpackerr_enabled }}"
