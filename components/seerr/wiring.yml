---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
seerr_enabled: false

seerr_identifier: "{{ mash_playbook_service_identifier_prefix }}seerr"

seerr_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}seerr"

seerr_uid: "{{ mash_playbook_uid }}"
seerr_gid: "{{ mash_playbook_gid }}"

seerr_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

seerr_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
seerr_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
