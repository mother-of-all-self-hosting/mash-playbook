---

activation_prefix: seerr_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ seerr_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ seerr_restart_necessary | bool }}"
        groups: [mash, seerr]
        when: "{{ seerr_enabled }}"
