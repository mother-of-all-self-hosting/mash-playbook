---

description: A monitoring and tracking tool for Plex Media Server
docs:
  name: Tautulli
  url: https://tautulli.com/
  section: foss
activation_prefix: tautulli_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ tautulli_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ tautulli_restart_necessary | bool }}"
        groups: [mash, tautulli]
        when: "{{ tautulli_enabled }}"
