---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
vikunja_enabled: false

vikunja_identifier: "{{ mash_playbook_service_identifier_prefix }}vikunja"

vikunja_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}vikunja"

vikunja_uid: "{{ mash_playbook_uid }}"
vikunja_gid: "{{ mash_playbook_gid }}"

vikunja_systemd_required_services_list_auto: |
  {{
    ([mariadb_identifier ~ '.service'] if mariadb_enabled | default(false) and (vikunja_database_mysql_hostname == mariadb_connection_hostname or vikunja_database_mysql_socket_enabled) and vikunja_database_type == 'mysql' else [])
    +
    ([postgres_identifier ~ '.service'] if postgres_enabled | default(false) and (vikunja_database_postgres_hostname == postgres_connection_hostname or vikunja_database_postgres_socket_enabled) and vikunja_database_type == 'postgres' else [])
  }}

vikunja_systemd_wanted_services_list_auto: |
  {{
    ([exim_relay_identifier ~ '.service'] if exim_relay_enabled | default(false) and vikunja_mailer_enabled | default(false) and vikunja_environment_variables_smtp_host == exim_relay_identifier else [])
    +
    ([lldap_identifier ~ '.service'] if lldap_enabled | default(false) else [])
    +
    ([typesense_identifier ~ '.service'] if typesense_enabled | default(false) else [])
  }}

vikunja_container_additional_networks_auto: |
  {{
    ([exim_relay_container_network] if exim_relay_enabled | default(false) and vikunja_mailer_enabled | default(false) and vikunja_environment_variables_smtp_host == exim_relay_identifier and vikunja_container_network != exim_relay_container_network else [])
    +
    ([lldap_container_network] if lldap_enabled | default(false) and vikunja_container_network != lldap_container_network else [])
    +
    ([mariadb_container_network] if mariadb_enabled | default(false) and (vikunja_database_mysql_hostname == mariadb_connection_hostname and vikunja_container_network != mariadb_container_network and not vikunja_database_mysql_socket_enabled) and vikunja_database_type == 'mysql' else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgres_container_network] if postgres_enabled | default(false) and (vikunja_database_postgres_hostname == postgres_connection_hostname and vikunja_container_network != postgres_container_network and not vikunja_database_postgres_socket_enabled) and vikunja_database_type == 'postgres' else [])
    +
    ([typesense_container_network] if typesense_enabled | default(false) and vikunja_container_network != typesense_container_network else [])
  }}

vikunja_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
vikunja_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"

vikunja_container_labels_traefik_metrics_enabled: "{{ vikunja_environment_variables_metrics_enabled and mash_playbook_metrics_exposure_enabled }}"
vikunja_container_labels_traefik_metrics_hostname: "{{ mash_playbook_metrics_exposure_hostname }}"
vikunja_container_labels_traefik_metrics_path_prefix: "{{ mash_playbook_metrics_exposure_path_prefix }}/{{ vikunja_identifier }}"
vikunja_container_labels_traefik_metrics_middleware_basic_auth_enabled: "{{ mash_playbook_metrics_exposure_http_basic_auth_enabled }}"
vikunja_container_labels_traefik_metrics_middleware_basic_auth_users: "{{ mash_playbook_metrics_exposure_http_basic_auth_users }}"

vikunja_environment_variables_metrics_enabled: "{{ prometheus_enabled | default(false) or mash_playbook_metrics_exposure_enabled }}"

vikunja_environment_variables_service_secret: "{{ (mash_playbook_generic_secret_key + ':s.vikunja') | hash('sha512') | to_uuid }}"
