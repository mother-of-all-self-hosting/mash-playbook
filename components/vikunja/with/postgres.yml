---

vikunja_database_postgres_hostname: "{{ postgres_connection_hostname if postgres_enabled else '' }}"
vikunja_database_postgres_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
vikunja_database_postgres_password: "{{ (mash_playbook_generic_secret_key + ':vikunja.db') | hash('sha512') | to_uuid }}"
vikunja_database_postgres_sslmode: "{{ 'disable' if postgres_enabled and (vikunja_database_postgres_hostname == postgres_connection_hostname or vikunja_database_postgres_socket_enabled) else 'require' }}"
vikunja_database_postgres_socket_path_host: "{{ postgres_run_path }}"
