---

pdfding_database_hostname: "{{ postgres_connection_hostname if postgres_enabled else '' }}"
pdfding_database_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
pdfding_database_password: "{{ (mash_playbook_generic_secret_key + ':db.pdfding') | hash('sha512') | to_uuid }}"
