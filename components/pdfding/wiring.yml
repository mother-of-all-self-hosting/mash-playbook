---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
pdfding_enabled: false

pdfding_identifier: "{{ mash_playbook_service_identifier_prefix }}pdfding"

pdfding_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}pdfding"

pdfding_uid: "{{ mash_playbook_uid }}"
pdfding_gid: "{{ mash_playbook_gid }}"

pdfding_systemd_required_services_list_auto: |
  {{
    ([postgres_identifier ~ '.service'] if postgres_enabled | default(false) and pdfding_database_hostname == postgres_connection_hostname and pdfding_database_type == 'postgres' else [])
  }}

pdfding_systemd_wanted_services_list_auto: |
  {{
    ([exim_relay_identifier ~ '.service'] if exim_relay_enabled | default(false) and pdfding_environment_variables_smtp_host == exim_relay_identifier else [])
  }}

pdfding_container_additional_networks_auto: |
  {{
    ([exim_relay_container_network] if exim_relay_enabled | default(false) and pdfding_environment_variables_smtp_host == exim_relay_identifier and pdfding_container_network != exim_relay_container_network else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgres_container_network] if postgres_enabled | default(false) and pdfding_database_hostname == postgres_connection_hostname and pdfding_container_network != postgres_container_network and pdfding_database_type == 'postgres' else [])
  }}

pdfding_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
pdfding_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"

pdfding_environment_variables_secret_key: "{{ (mash_playbook_generic_secret_key + ':pdfding.s') | hash('sha512') | to_uuid }}"
