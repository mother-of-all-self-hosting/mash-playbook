---

activation_prefix: mailcrab_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ mailcrab_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ mailcrab_restart_necessary | bool }}"
        groups: [mash, mailcrab]
        when: "{{ mailcrab_enabled }}"
