---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
ots_enabled: false

ots_identifier: "{{ mash_playbook_service_identifier_prefix }}ots"

ots_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}ots"

ots_uid: "{{ mash_playbook_uid }}"
ots_gid: "{{ mash_playbook_gid }}"

ots_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

ots_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
ots_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
