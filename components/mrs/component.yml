---

description: A fully-featured, standalone, Matrix rooms search service
docs:
  name: Matrix Rooms Search API
  url: https://github.com/etkecc/mrs
  section: foss
activation_prefix: mrs_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ mrs_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ mrs_restart_necessary | bool }}"
        groups: [mash, mrs]
        when: "{{ mrs_enabled }}"
