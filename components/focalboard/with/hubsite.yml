---

# Focalboard
mash_playbook_hubsite_service_focalboard_enabled: "{{ focalboard_enabled }}"
mash_playbook_hubsite_service_focalboard_name: Focalboard
mash_playbook_hubsite_service_focalboard_url: "https://{{ focalboard_hostname }}{{ focalboard_path_prefix }}"
mash_playbook_hubsite_service_focalboard_logo_location: "{{ role_path }}/assets/focalboard.png"
mash_playbook_hubsite_service_focalboard_description: "An open-source, self-hosted alternative to Trello, Notion, and Asana."
mash_playbook_hubsite_service_focalboard_priority: 1000
