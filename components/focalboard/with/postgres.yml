---

focalboard_database_hostname: "{{ postgres_connection_hostname if postgres_enabled else '' }}"
focalboard_database_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
focalboard_database_password: "{{ (mash_playbook_generic_secret_key + ':db.focalboard') | hash('sha512') | to_uuid }}"
focalboard_database_sslmode: "{{ 'disable' if postgres_enabled and focalboard_database_hostname == postgres_connection_hostname else 'prefer' }}"
