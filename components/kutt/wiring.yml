---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
kutt_enabled: false

kutt_identifier: "{{ mash_playbook_service_identifier_prefix }}kutt"

kutt_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}kutt"

kutt_uid: "{{ mash_playbook_uid }}"
kutt_gid: "{{ mash_playbook_gid }}"

kutt_systemd_required_services_list_auto: |
  {{
    ([mariadb_identifier ~ '.service'] if mariadb_enabled | default(false) and kutt_database_mysql_hostname == mariadb_connection_hostname and kutt_database_type == 'mysql' else [])
    +
    ([postgres_identifier ~ '.service'] if postgres_enabled | default(false) and (kutt_database_postgres_hostname == postgres_connection_hostname or kutt_database_postgres_socket_enabled) and kutt_database_type == 'postgres' else [])
  }}

kutt_systemd_wanted_services_list_auto: |
  {{
    ([exim_relay_identifier ~ '.service'] if exim_relay_enabled | default(false) and kutt_environment_variables_smtp_enabled | default(false) and kutt_environment_variables_smtp_host == exim_relay_identifier else [])
  }}

kutt_container_additional_networks_auto: |
  {{
    ([exim_relay_container_network] if exim_relay_enabled | default(false) and kutt_environment_variables_smtp_enabled | default(false) and kutt_environment_variables_smtp_host == exim_relay_identifier and kutt_container_network != exim_relay_container_network else [])
    +
    ([mariadb_container_network] if mariadb_enabled | default(false) and kutt_database_mysql_hostname == mariadb_connection_hostname and kutt_container_network != mariadb_container_network and kutt_database_type == 'mysql' else [])
    +
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgres_container_network] if postgres_enabled | default(false) and (kutt_database_postgres_hostname == postgres_connection_hostname and kutt_container_network != postgres_container_network and not kutt_database_postgres_socket_enabled) and kutt_database_type == 'postgres' else [])
  }}

kutt_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
kutt_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"

kutt_environment_variables_jwt_secret: "{{ (mash_playbook_generic_secret_key + ':kutt') | hash('sha512') | to_uuid }}"
