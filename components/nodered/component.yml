---

activation_prefix: nodered_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ nodered_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ nodered_restart_necessary | bool }}"
        groups: [mash, nodered]
        when: "{{ nodered_enabled }}"
