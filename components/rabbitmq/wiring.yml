---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
rabbitmq_enabled: false

rabbitmq_identifier: "{{ mash_playbook_service_identifier_prefix }}rabbitmq"

rabbitmq_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}rabbitmq"

rabbitmq_uid: "{{ mash_playbook_uid }}"
rabbitmq_gid: "{{ mash_playbook_gid }}"

rabbitmq_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
  }}

# Only enable Traefik labels if a hostname is set (indicating that this will be exposed publicly)
rabbitmq_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled and rabbitmq_hostname | length > 0 }}"
rabbitmq_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
