---

activation_prefix: rabbitmq_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ rabbitmq_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ rabbitmq_restart_necessary | bool }}"
        groups: [mash, rabbitmq]
        when: "{{ rabbitmq_enabled }}"
