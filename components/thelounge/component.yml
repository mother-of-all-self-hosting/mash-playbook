---

description: Web IRC client which stays connected to IRC servers
docs:
  name: The Lounge
  url: https://thelounge.chat/
  section: foss
activation_prefix: thelounge_

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
      - name: "{{ thelounge_identifier }}.service"
        priority: 2000
        restart_necessary: "{{ thelounge_restart_necessary | bool }}"
        groups: [mash, thelounge]
        when: "{{ thelounge_enabled }}"
