---

exclude: ^(LICENSES/|releases.opml|VERSIONS.md|var/)

# See: https://pre-commit.com/hooks.html
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
        args: ["--assume-in-merge"]
      - id: detect-private-key
      - id: check-json
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint
        args: [
          --disable=MD013, # line-length
          --disable=MD033, # no-inline-html
          --disable=MD051, # link-fragments
          --disable=MD059  # descriptive-link-text
        ]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/ansible/ansible-lint
    rev: v26.10.1
    hooks:
      - id: ansible-lint
        files: '^roles/mash/'
        args: ['roles/mash']
        pass_filenames: false
        language_version: python3
  - repo: local
    hooks:
      - id: check-components
        name: Check the structure of components/
        entry: bin/optimize.py --components-path=components --check
        language: python
        additional_dependencies: ['pyyaml==6.0.3']
        files: '^(components/|bin/optimize\.py$|\.pre-commit-config\.yaml$)'
        pass_filenames: false
      - id: check-components-jinja
        name: Check the Jinja syntax in components/
        entry: bin/check-components-jinja.py
        language: python
        additional_dependencies: ['jinja2==3.1.6', 'pyyaml==6.0.3']
        files: '^components/.*\.yml$'
      - id: test-optimize
        name: Test playbook optimization
        entry: tests/optimize/test_optimize.py
        language: python
        additional_dependencies: ['pyyaml==6.0.3']
        files: '^(justfile|bin/(optimize\.py|install-roles\.py|ansible-python\.sh)|components/.*\.yml|docs/installing\.md|tests/optimize/.*|\.pre-commit-config\.yaml)$'
        pass_filenames: false
      - id: test-install-roles
        name: Test role installation
        entry: tests/install_roles/test_install_roles.py
        language: python
        additional_dependencies: ['pyyaml==6.0.3']
        files: '^(bin/install-roles\.py|tests/install_roles/.*|\.pre-commit-config\.yaml)$'
        pass_filenames: false
      - id: test-ansible-python
        name: Test running Python with Ansible's interpreter
        entry: tests/ansible_python/test_ansible_python.py
        language: python
        files: '^(bin/ansible-python\.sh|tests/ansible_python/.*|\.pre-commit-config\.yaml)$'
        pass_filenames: false
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.181.11
    hooks:
      - id: renovate-config-validator
