---
# Project source code URL: https://github.com/oliverlorenz/ohrwurm-app

ohrwurm_enabled: true

ohrwurm_identifier: ohrwurm
ohrwurm_base_path: "{{ mash_playbook_base_path }}/{{ ohrwurm_identifier }}"

ohrwurm_container_image: "ghcr.io/oliverlorenz/ohrwurm-app:latest"
ohrwurm_container_image_force_pull: true

ohrwurm_container_image_registry_login_server: ghcr.io
ohrwurm_container_image_registry_username: ""
ohrwurm_container_image_registry_password: ""

# All optional - ohrwurm-app runs in demo mode (SongScan disabled, no Spotify) without them.
ohrwurm_environment_audd_api_token: ""
ohrwurm_environment_session_secret: ""
ohrwurm_environment_spotify_client_id: ""
ohrwurm_environment_spotify_client_secret: ""

# Additional environment variables to pass to the container.
ohrwurm_environment_variables_additional_variables: ""

# Controls whether the container exposes its HTTP port (tcp/3000 in the container).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:3000"), or empty string to not expose.
ohrwurm_container_http_host_bind_port: ""

# The base container network. It will be auto-created by this role if it doesn't exist already.
ohrwurm_container_network: "{{ ohrwurm_identifier }}"

# The port number in the container
ohrwurm_container_http_port: 3000

# The hostname at which ohrwurm-app is served.
ohrwurm_hostname: ""

# The path at which ohrwurm-app is exposed.
# This value must either be `/` or not end with a slash (e.g. `/ohrwurm`).
ohrwurm_path_prefix: /

# Must match the redirect URI registered in the Spotify app dashboard exactly.
ohrwurm_environment_spotify_redirect_uri: "https://{{ ohrwurm_hostname }}/auth/spotify/callback"

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
ohrwurm_container_additional_networks: "{{ ohrwurm_container_additional_networks_auto + ohrwurm_container_additional_networks_custom }}"
ohrwurm_container_additional_networks_auto: []
ohrwurm_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# ohrwurm-app is stateless (no database, in-memory sessions), so this is empty by default.
ohrwurm_container_additional_volumes: "{{ ohrwurm_container_additional_volumes_auto + ohrwurm_container_additional_volumes_custom }}"
ohrwurm_container_additional_volumes_auto: []
ohrwurm_container_additional_volumes_custom: []

# A list of extra arguments to pass to the container (`docker run` command)
ohrwurm_container_extra_arguments: []

# ohrwurm_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `ohrwurm_container_labels_additional_labels`.
ohrwurm_container_labels_traefik_enabled: true
ohrwurm_container_labels_traefik_docker_network: "{{ ohrwurm_container_network }}"
ohrwurm_container_labels_traefik_hostname: "{{ ohrwurm_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/ohrwurm`).
ohrwurm_container_labels_traefik_path_prefix: "{{ ohrwurm_path_prefix }}"
ohrwurm_container_labels_traefik_rule: "Host(`{{ ohrwurm_container_labels_traefik_hostname }}`)"
ohrwurm_container_labels_traefik_priority: 0
ohrwurm_container_labels_traefik_entrypoints: web-secure
ohrwurm_container_labels_traefik_tls: "{{ ohrwurm_container_labels_traefik_entrypoints != 'web' }}"
ohrwurm_container_labels_traefik_tls_certResolver: default  # noqa var-naming

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `ohrwurm_container_labels_traefik_additional_request_headers_custom`
ohrwurm_container_labels_traefik_additional_request_headers: "{{ ohrwurm_container_labels_traefik_additional_request_headers_auto | combine(ohrwurm_container_labels_traefik_additional_request_headers_custom) }}"
ohrwurm_container_labels_traefik_additional_request_headers_auto: {}
ohrwurm_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `ohrwurm_container_labels_traefik_additional_response_headers_custom`
ohrwurm_container_labels_traefik_additional_response_headers: "{{ ohrwurm_container_labels_traefik_additional_response_headers_auto | combine(ohrwurm_container_labels_traefik_additional_response_headers_custom) }}"
ohrwurm_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': ohrwurm_http_header_xss_protection} if ohrwurm_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': ohrwurm_http_header_content_type_options} if ohrwurm_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': ohrwurm_http_header_content_security_policy} if ohrwurm_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': ohrwurm_http_header_permissions_policy} if ohrwurm_http_header_permissions_policy else {})
    | combine ({'Strict-Transport-Security': ohrwurm_http_header_strict_transport_security} if ohrwurm_http_header_strict_transport_security and ohrwurm_container_labels_traefik_tls else {})
  }}
ohrwurm_container_labels_traefik_additional_response_headers_custom: {}

# ohrwurm_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
ohrwurm_container_labels_additional_labels: ""

# Specifies the value of the `X-XSS-Protection` header
ohrwurm_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
ohrwurm_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
ohrwurm_http_header_content_security_policy: frame-ancestors 'self'

# Specifies the value of the `Permissions-Policy` header.
ohrwurm_http_header_permissions_policy: "{{ 'interest-cohort=()' if ohrwurm_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
ohrwurm_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if ohrwurm_hsts_preload_enabled else '' }}"

ohrwurm_floc_optout_enabled: true
ohrwurm_hsts_preload_enabled: false

# List of systemd services that the ohrwurm systemd service depends on
ohrwurm_systemd_required_services_list: "{{ ohrwurm_systemd_required_services_list_default + ohrwurm_systemd_required_services_list_auto + ohrwurm_systemd_required_services_list_custom }}"
ohrwurm_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
ohrwurm_systemd_required_services_list_auto: []
ohrwurm_systemd_required_services_list_custom: []

# List of systemd services that the ohrwurm systemd service wants
ohrwurm_systemd_wanted_services_list: "{{ ohrwurm_systemd_wanted_services_list_default + ohrwurm_systemd_wanted_services_list_auto + ohrwurm_systemd_wanted_services_list_custom }}"
ohrwurm_systemd_wanted_services_list_default: []
ohrwurm_systemd_wanted_services_list_auto: []
ohrwurm_systemd_wanted_services_list_custom: []
