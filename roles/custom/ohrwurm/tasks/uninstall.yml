---
- name: Check existence of ohrwurm systemd service
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ ohrwurm_identifier }}.service"
  register: ohrwurm_service_stat

- name: Uninstall ohrwurm systemd services and files
  when: ohrwurm_service_stat.stat.exists | bool
  block:
    - name: Ensure ohrwurm systemd service is stopped
      ansible.builtin.service:
        name: "{{ ohrwurm_identifier }}"
        state: stopped
        enabled: false
        daemon_reload: true

    - name: Ensure ohrwurm systemd service does not exist
      ansible.builtin.file:
        path: "{{ devture_systemd_docker_base_systemd_path }}/{{ ohrwurm_identifier }}.service"
        state: absent

    - name: Ensure ohrwurm container network does not exist via community.docker.docker_network
      when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
      community.docker.docker_network:
        name: "{{ ohrwurm_container_network }}"
        state: absent

    - name: Ensure ohrwurm container network does not exist via ansible.builtin.command
      when: devture_systemd_docker_base_container_network_creation_method == 'command'
      ansible.builtin.command:
        cmd: >-
          {{ devture_systemd_docker_base_host_command_docker }} network rm
          {{ ohrwurm_container_network }}
      register: network_deletion_result
      changed_when: ohrwurm_container_network in network_deletion_result.stdout

    - name: Ensure ohrwurm path does not exist
      ansible.builtin.file:
        path: "{{ ohrwurm_base_path }}"
        state: absent
