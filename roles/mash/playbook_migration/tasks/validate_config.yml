- name: (Deprecation) Catch and report KeyDB variables
  ansible.builtin.fail:
    msg: |-
      KeyDB was removed from the playbook in August 2026, because the KeyDB project has been unmaintained since 2023.

      Valkey is a well-maintained alternative (also a Redis fork, protocol-compatible) and has been this playbook's recommendation since 2024-11-23. See `docs/services/valkey.md` for enabling it and pointing your services at it.

      Please remove all `keydb_*` variables from your configuration file (vars.yml).

      You may also wish to uninstall the KeyDB service manually. See `docs/services/keydb.md` for more information.

      The following variables in your configuration need to be removed: {{ lookup('ansible.builtin.varnames', '^keydb_.+', wantlist=True) | join(', ') }}
  when: "lookup('ansible.builtin.varnames', '^keydb_.+', wantlist=True) | length > 0"

- name: (Deprecation) Catch and report APISIX Dashboard variables
  ansible.builtin.fail:
    msg: |-
      APISIX Dashboard was removed from the playbook in August 2026, because it is no longer a separately released project.

      Upstream has rewritten the dashboard as a pure front-end which ships inside the `apache/apisix` container image itself, starting with APISIX 3.13. Your APISIX is already serving it at `/ui/` on its Admin API port, so there is nothing to install.

      Note that the bundled dashboard shares a listener and an IP allowlist with the Admin API and has no authentication of its own, so reaching it is not the same as reaching the standalone dashboard was. See `docs/services/apisix.md` for how to get to it safely.

      Please remove all `apisix_dashboard_*` variables from your configuration file (vars.yml).

      You may also wish to uninstall the standalone APISIX Dashboard service manually. See `docs/services/apisix-dashboard.md` for more information.

      The following variables in your configuration need to be removed: {{ lookup('ansible.builtin.varnames', '^apisix_dashboard_.+', wantlist=True) | join(', ') }}
  when: "lookup('ansible.builtin.varnames', '^apisix_dashboard_.+', wantlist=True) | length > 0"

# The apisix role catches this too, and with the same detail. This copy fires
# earlier and does not depend on the role having been fetched, so somebody who
# runs the playbook before `just update` still gets told what to change rather
# than an "the role galaxy/apisix was not found" error.
- name: (Deprecation) Catch and report APISIX variables
  vars:
    apisix_deprecated_variables: "{{ lookup('ansible.builtin.varnames', '^apisix_gateway_.+', wantlist=True) | sort }}"

    # Variables which had already been renamed to something that is not a plain
    # `apisix_gateway_` -> `apisix_` prefix swap. Without them, the message
    # below would point at variables that have never existed.
    apisix_deprecated_variables_special_cases:
      apisix_gateway_systemd_required_systemd_services_list_default: apisix_systemd_required_services_list_default
      apisix_gateway_systemd_required_systemd_services_list_auto: apisix_systemd_required_services_list_auto
      apisix_gateway_systemd_required_systemd_services_list_custom: apisix_systemd_required_services_list_custom
      apisix_gateway_container_image_force_pull: <remove it - the community.docker.docker_image_pull module handles this natively>
  ansible.builtin.fail:
    msg: |-
      The APISIX role is now called `apisix` rather than `apisix-gateway`, and every one of its variables lost the `_gateway` from its prefix (`apisix_gateway_*` -> `apisix_*`). It stopped installing only a gateway when APISIX 3.13 started shipping the APISIX Dashboard inside the `apache/apisix` image.

      Please rename the following variables in your configuration file (vars.yml):
      {% for old_name in apisix_deprecated_variables %}
      - `{{ old_name }}` -> `{{ apisix_deprecated_variables_special_cases[old_name] | default('apisix_' + old_name | regex_replace('^apisix_gateway_', '')) }}`
      {% endfor %}

      The `# apisix_gateway` section markers around that block in your vars.yml are now `# apisix`, and the tags are too: `just install-service apisix` rather than `just install-service apisix-gateway`.

      Only the names changed. `apisix_identifier` still resolves to the same value, so your systemd service, container, container network and data path keep the names they have now, and nothing is reinstalled or moved. See `docs/services/apisix.md`.
  when: apisix_deprecated_variables | length > 0

