---
# Entry point (user-triggered), service-scoped counterpart of deploy-setup-all.yml. Same
# orchestration (deploy -> record known-good -> approval-gated auto-rollback); the deploy
# step itself lives in deploy-run-setup-service.yml so it can be reused for both paths.
name: Deploy - setup-service

on:
  workflow_dispatch:
    inputs:
      host:
        description: Target host
        required: true
        type: choice
        options:
          # BEGIN GENERATED: hosts
          - mash.oliverlorenz.com
          # END GENERATED: hosts
        default: mash.oliverlorenz.com
      service:
        description: Service to set up
        required: true
        type: choice
        options:
          # BEGIN GENERATED: services
          - app-dooropener
          - bentopdf
          - cleanup
          - container_socket_proxy
          - convertx
          - dayplanner
          - dns_records
          - docker
          - docker_sdk_for_python
          - gotosocial
          - gowa
          - keydb
          - languagetool
          - n8n
          - ohrwurm
          - oliverlorenz-api
          - openwebui
          - paperless
          - paperless_ai
          - playbook_help
          - playbook_runtime_messages
          - postgres
          - rssbridge
          - systemd_docker_base
          - systemd_service_manager
          - timesync
          - tinyauth
          - traefik
          - uptime_kuma
          - vaultwarden
          # END GENERATED: services
      ref:
        description: mash-playbook ref (branch, tag, or commit) to deploy. Leave empty to deploy the ref this workflow is run from.
        required: false
        type: string

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy
    uses: ./.github/workflows/deploy-run-setup-service.yml
    with:
      service: ${{ inputs.service }}
      host: ${{ inputs.host }}
      ref: ${{ inputs.ref }}
    secrets: inherit

  record-success:
    name: Record last known-good ref
    needs: deploy
    if: needs.deploy.result == 'success'
    uses: ./.github/workflows/record-deployed-ref.yml
    with:
      host: ${{ inputs.host }}
      sha: ${{ needs.deploy.outputs.deployed_sha }}
    secrets: inherit

  await-rollback-approval:
    name: Await rollback approval
    needs: deploy
    if: failure()
    environment: rollback-approval
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve last known-good ref
        id: resolve
        run: |
          if git rev-parse -q --verify "refs/tags/deployed/${{ inputs.host }}" >/dev/null; then
            echo "sha=$(git rev-parse "refs/tags/deployed/${{ inputs.host }}")" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No previously successful deploy recorded for host '${{ inputs.host }}' -- nothing to roll back to."
            exit 1
          fi

  rollback:
    name: Auto-rollback (${{ inputs.host }})
    needs: await-rollback-approval
    if: always() && needs.await-rollback-approval.result == 'success'
    uses: ./.github/workflows/deploy-run-setup-service.yml
    with:
      service: ${{ inputs.service }}
      host: ${{ inputs.host }}
      ref: ${{ needs.await-rollback-approval.outputs.sha }}
    secrets: inherit

  record-rollback-success:
    name: Record last known-good ref (post-rollback)
    needs: rollback
    if: always() && needs.rollback.result == 'success'
    uses: ./.github/workflows/record-deployed-ref.yml
    with:
      host: ${{ inputs.host }}
      sha: ${{ needs.rollback.outputs.deployed_sha }}
    secrets: inherit
