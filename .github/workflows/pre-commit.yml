---
name: pre-commit

on:  # yamllint disable-line rule:truthy
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prek:
    name: Run prek hooks
    runs-on: ubuntu-26.04

    # Same-repository pull requests already run via the push event;
    # run pull_request jobs only for pull requests from forks.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository

    container:
      image: docker.io/archlinux:base-devel

    steps:
      # git must be installed before checkout so it does a proper clone
      # (with .git directory) instead of a tarball download.
      # Always upgrade (-Syu): Arch does not support partial upgrades, and
      # installing packages from a refreshed database onto the image's older
      # packages fails whenever the repositories have moved on.
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git just mise python

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore prek cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: var/prek
          key: arch-prek-v1-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run prek hooks
        run: |
          # The checkout action sets safe.directory using its own bundled
          # git, which is separate from the pacman-installed git that prek uses.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          just prek-run-on-all
